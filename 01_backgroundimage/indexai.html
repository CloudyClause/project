<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Outback Service Banner</title>

    <link rel="stylesheet" href="./css/stylesai.css">
</head>

<body>

    <main>
        <section class="service-section">

            <div class="service-inner">

                <!-- 예약하기 -->
                <a href="#" class="service-card reserve-card">

                    <div class="service-text">
                        <h2>RESERVE</h2>
                        <p>예약하기</p>
                    </div>

                    <span class="service-arrow" aria-hidden="true"></span>

                    <div
                        class="service-image reserve-image"
                        aria-hidden="true"
                    ></div>

                </a>


                <!-- 사후 적립 -->
                <a href="#" class="service-card save-card">

                    <div class="service-text">
                        <h2>SAVE POINT</h2>
                        <p>사후 적립</p>
                    </div>

                    <span class="service-arrow" aria-hidden="true"></span>

                    <div
                        class="service-image save-image"
                        aria-hidden="true"
                    ></div>

                </a>


                <!-- 딜리버리 -->
                <a href="#" class="service-card delivery-card">

                    <div class="service-text">
                        <h2>DELIVERY</h2>
                        <p>딜리버리</p>
                    </div>

                    <span class="service-arrow" aria-hidden="true"></span>

                    <div
                        class="service-image delivery-image"
                        aria-hidden="true"
                    ></div>

                </a>

            </div>
        </section>
    </main>

</body>
</html>
