<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>이어타고 - 온보딩 2</title>

  <style>
    :root {
      --primary-navy: #061a3d;
      --primary-blue: #005bff;
      --text-primary: #111827;
      --text-secondary: #6b7280;
      --border-gray: #d9dee6;
      --surface-white: #ffffff;
      --app-bg: #f3f3f3;
      --indicator-gray: #cfcfcf;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      font-family:
        "Pretendard",
        "Noto Sans KR",
        "Apple SD Gothic Neo",
        Arial,
        sans-serif;
      background: var(--app-bg);
    }

    body {
      overflow-x: hidden;
    }

    button {
      font: inherit;
    }

    .app {
      width: 100%;
      min-height: 100svh;
      background: var(--app-bg);
      display: flex;
      flex-direction: column;
      padding: 48px 24px 28px;
    }

    .header {
      width: 100%;
      text-align: center;
      margin-top: 28px;
    }

    .title {
      color: var(--primary-navy);
      font-size: 24px;
      line-height: 1.35;
      font-weight: 800;
      letter-spacing: -0.8px;
    }

    .description {
      margin-top: 14px;
      color: var(--text-secondary);
      font-size: 16px;
      line-height: 1.45;
      font-weight: 500;
      letter-spacing: -0.4px;
    }

    .card {
      width: 100%;
      margin-top: 30px;
      border: 2px solid var(--border-gray);
      border-radius: 18px;
      background: var(--surface-white);
      overflow: hidden;
    }

    .card-visual {
      width: 100%;
      display: block;
    }

    .card-visual img {
      width: 100%;
      display: block;
    }

    .card-content {
      padding: 16px 18px 14px;
      text-align: center;
      background: var(--surface-white);
    }

    .card-title {
      color: var(--primary-navy);
      font-size: 22px;
      line-height: 1.35;
      font-weight: 800;
      letter-spacing: -0.8px;
    }

    .card-text {
      margin-top: 12px;
      color: var(--text-secondary);
      font-size: 15px;
      line-height: 1.45;
      font-weight: 500;
      letter-spacing: -0.35px;
    }

    .indicator {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 40px;
      margin-top: 32px;
    }

    .dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--indicator-gray);
    }

    .dot.active {
      background: var(--primary-blue);
    }

    .actions {
      margin-top: auto;
      padding-top: 34px;
    }

    .next-btn {
      width: 100%;
      height: 52px;
      border: 0;
      border-radius: 16px;
      background: #1260f4;
      color: #ffffff;
      font-size: 17px;
      line-height: 24px;
      font-weight: 700;
      cursor: pointer;
    }

    .skip-btn {
      width: 100%;
      height: 44px;
      margin-top: 14px;
      border: 0;
      background: transparent;
      color: var(--primary-blue);
      font-size: 16px;
      line-height: 24px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <h1 class="title">모바일 티켓 발급</h1>
      <p class="description">
        모바일 티켓을 발급받아<br />
        QR코드로 간편하게 탑승하세요.
      </p>
    </header>

    <section class="card">
      <div class="card-visual">
        <img
          src="./images/Onboardimg2.svg"
          alt="스마트폰 QR 티켓 발급 일러스트"
        />
      </div>

      <div class="card-content">
        <h2 class="card-title">QR로 빠른 탑승</h2>
        <p class="card-text">
          발급한 QR코드를 개찰구에<br />
          인식하면 바로 탑승 완료!
        </p>
      </div>
    </section>

    <div class="indicator" aria-label="온보딩 진행 상태">
      <span class="dot"></span>
      <span class="dot active"></span>
      <span class="dot"></span>
    </div>

    <div class="actions">
      <button type="button" class="next-btn">다음</button>
      <button type="button" class="skip-btn">건너뛰기</button>
    </div>
  </main>
  <script>
  const nextButton = document.querySelector(".next-btn");
  const skipButton = document.querySelector(".skip-btn");

  const autoMoveTimer = setTimeout(function () {
    window.location.href = "./onboarding3.html";
  }, 2000);

  nextButton.addEventListener("click", function () {
    clearTimeout(autoMoveTimer);
    window.location.href = "./onboarding3.html";
  });

  skipButton.addEventListener("click", function () {
    clearTimeout(autoMoveTimer);
    window.location.href = "./login.html";
  });
  </script>
</body>
</html>
