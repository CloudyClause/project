<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>진달래 꽃</title>

  <style>
    html,
    body {
      width: 100%;
      min-width: 1200px;
      min-height: 495px;
      margin: 0;
    }

    body {
      position: relative;
      overflow: hidden;
      background: #ffffff;
      color: #000000;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", Arial, sans-serif;
    }

    h1 {
      position: absolute;
      top: 22px;
      left: 50%;
      width: 300px;
      margin: 0;
      transform: translateX(-50%);
      font-size: 34px;
      line-height: 1.2;
      font-weight: 700;
      text-align: center;
      white-space: nowrap;
    }

    .author {
      position: absolute;
      top: 87px;
      right: 8px;
      width: 300px;
      margin: 0;
      font-size: 27px;
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: -0.5px;
      text-align: right;
      white-space: nowrap;
    }

    p {
      margin: 0;
    }

    .poem {
      position: absolute;
      left: 50%;
      width: 220px;
      transform: translateX(-50%);
      font-size: 16px;
      line-height: 20px;
      font-weight: 400;
      text-align: center;
      white-space: nowrap;
    }

    .poem-1 {
      top: 141px;
    }

    .poem-2 {
      top: 221px;
    }

    .poem-3 {
      top: 301px;
    }

    .poem-4 {
      top: 381px;
    }
  </style>
</head>

<body>
  <h1>진달래 꽃</h1>

  <h2 class="author">지은이: 김소월</h2>

  <p class="poem poem-1">
    나 보기가<br>
    역겨워<br>
    가실 때에는
  </p>

  <p class="poem poem-2">
    말 없이<br>
    고이<br>
    보내 드리오리다
  </p>

  <p class="poem poem-3">
    영변에<br>
    약산<br>
    진달래 꽃
  </p>

  <p class="poem poem-4">
    진달래<br>
    진달래 꽃<br>
    피웠네
  </p>
</body>
</html>
