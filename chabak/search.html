<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0,
        minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>CAMBAK 검색결과</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            overflow: hidden;
            background-color: #ffffff;
            color: #111111;
            font-family: Arial, "Noto Sans KR", sans-serif;
        }

        img {
            display: block;
            max-width: 100%;
        }

        button,
        a {
            border: 0;
            outline: 0;
            background: none;
            color: inherit;
            font: inherit;
            text-decoration: none;
        }

        button,
        a {
            cursor: pointer;
        }

        .app {
            position: relative;
            width: 100%;
            height: 100svh;
            overflow: hidden;
            background-color: #ffffff;
        }

        /* 상단 내비게이션 */

        .top-navigation {
            position: absolute;
            top: 0;
            right: 0;
            left: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 81px;
            border-bottom: 1px solid #eeeeee;
            background-color: #ffffff;
        }

        .back-button {
            position: absolute;
            left: 20px;
            top: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 44px;
            transform: translateY(-50%);
        }

        .back-button img {
            width: 26px;
            height: 34px;
            object-fit: contain;
        }

        .page-title {
            color: #111111;
            font-size: 18px;
            font-weight: 700;
            line-height: 1;
            letter-spacing: -0.6px;
        }

        /* 검색 결과 스크롤 영역 */

        .search-content {
            width: 100%;
            height: 100%;
            padding-top: 81px;
            padding-bottom: calc(82px + env(safe-area-inset-bottom));
            overflow-x: hidden;
            overflow-y: auto;
            overscroll-behavior-y: contain;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .search-content::-webkit-scrollbar {
            display: none;
        }

        .result-list {
            width: 100%;
        }

        .result-item {
            position: relative;
            display: grid;
            grid-template-columns: 100px 1fr;
            gap: 14px;
            width: 100%;
            min-height: 148px;
            padding: 24px;
            border-bottom: 1px solid #eeeeee;
            background-color: #ffffff;
        }

        .place-thumbnail {
            width: 100px;
            height: 100px;
            overflow: hidden;
            border-radius: 8px;
            background-color: #eeeeee;
        }

        .place-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .place-content {
            position: relative;
            min-width: 0;
            padding-right: 28px;
        }

        .place-title {
            overflow: hidden;
            color: #111111;
            font-size: 17px;
            font-weight: 700;
            line-height: 1.3;
            letter-spacing: -0.6px;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .place-address {
            margin-top: 3px;
            color: #333333;
            font-size: 13px;
            font-weight: 400;
            line-height: 1.4;
            letter-spacing: -0.3px;
        }

        .bookmark-button {
            position: absolute;
            top: 1px;
            right: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 36px;
        }

        .bookmark-button img {
            width: 22px;
            height: 28px;
            object-fit: contain;
        }

        .place-bottom {
            position: absolute;
            right: 0;
            bottom: 0;
            left: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .place-tags {
            display: flex;
            align-items: center;
            gap: 4px;
            min-width: 0;
        }

        .place-tag {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 25px;
            padding: 0 10px;
            border-radius: 9px;
            background-color: #5875b9;
            color: #ffffff;
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
        }

        .place-distance {
            flex-shrink: 0;
            color: #4f70bd;
            font-size: 16px;
            font-weight: 500;
            line-height: 1;
            white-space: nowrap;
        }

        /* 하단 공통 탭바 */

        .bottom-navigation {
            position: absolute;
            right: 0;
            bottom: 0;
            left: 0;
            z-index: 30;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            width: 100%;
            height: calc(82px + env(safe-area-inset-bottom));
            padding-bottom: env(safe-area-inset-bottom);
            border-top: 1px solid #eeeeee;
            background-color: #ffffff;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            color: #111111;
        }

        .nav-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
        }

        .nav-icon img {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }

        .nav-label {
            font-size: 15px;
            font-weight: 600;
            line-height: 1;
        }

        .nav-item.active {
            color: #5273bd;
        }
    </style>
</head>

<body>
    <main class="app">

        <header class="top-navigation">
            <button
                type="button"
                class="back-button"
                id="backButton"
                aria-label="이전 페이지로 이동"
            >
                <img
                    src="./icons/arrow.svg"
                    alt=""
                >
            </button>

            <h1 class="page-title">검색결과</h1>
        </header>

        <div class="search-content">

            <section class="result-list">

                <article class="result-item">
                    <a href="#" class="place-thumbnail">
                        <img
                            src="./images/searchimg1.png"
                            alt="망원한강공원"
                        >
                    </a>

                    <div class="place-content">
                        <h2 class="place-title">망원한강공원</h2>

                        <p class="place-address">
                            서울 마포구 망원동 205-4
                        </p>

                        <button
                            type="button"
                            class="bookmark-button"
                            aria-label="망원한강공원 저장"
                        >
                            <img
                                src="./icons/save.svg"
                                alt=""
                            >
                        </button>

                        <div class="place-bottom">
                            <div class="place-tags">
                                <span class="place-tag">차크닉</span>
                                <span class="place-tag">주차장</span>
                            </div>

                            <span class="place-distance">11.1km</span>
                        </div>
                    </div>
                </article>

                <article class="result-item">
                    <a href="#" class="place-thumbnail">
                        <img
                            src="./images/searchimg2.png"
                            alt="광교호수공원"
                        >
                    </a>

                    <div class="place-content">
                        <h2 class="place-title">광교호수공원</h2>

                        <p class="place-address">
                            서울 마포구 망원동 205-4
                        </p>

                        <button
                            type="button"
                            class="bookmark-button"
                            aria-label="광교호수공원 저장"
                        >
                            <img
                                src="./icons/save.svg"
                                alt=""
                            >
                        </button>

                        <div class="place-bottom">
                            <div class="place-tags">
                                <span class="place-tag">도심</span>
                                <span class="place-tag">주차장</span>
                            </div>

                            <span class="place-distance">26km</span>
                        </div>
                    </div>
                </article>

                <article class="result-item">
                    <a href="#" class="place-thumbnail">
                        <img
                            src="./images/searchimg3.png"
                            alt="강릉 안반데기"
                        >
                    </a>

                    <div class="place-content">
                        <h2 class="place-title">강릉 안반데기</h2>

                        <p class="place-address">
                            대기리 2214-207
                        </p>

                        <button
                            type="button"
                            class="bookmark-button"
                            aria-label="강릉 안반데기 저장"
                        >
                            <img
                                src="./icons/save.svg"
                                alt=""
                            >
                        </button>

                        <div class="place-bottom">
                            <div class="place-tags">
                                <span class="place-tag">오션뷰</span>
                                <span class="place-tag">주차장</span>
                            </div>

                            <span class="place-distance">108km</span>
                        </div>
                    </div>
                </article>

                <article class="result-item">
                    <a href="#" class="place-thumbnail">
                        <img
                            src="./images/searchimg4.png"
                            alt="화성 궁평항"
                        >
                    </a>

                    <div class="place-content">
                        <h2 class="place-title">화성 궁평항</h2>

                        <p class="place-address">
                            경기도 화성시 서신면<br>
                            궁평항로 1049-24
                        </p>

                        <button
                            type="button"
                            class="bookmark-button"
                            aria-label="화성 궁평항 저장"
                        >
                            <img
                                src="./icons/save.svg"
                                alt=""
                            >
                        </button>

                        <div class="place-bottom">
                            <div class="place-tags">
                                <span class="place-tag">차크닉</span>
                                <span class="place-tag">주차장</span>
                            </div>

                            <span class="place-distance">58km</span>
                        </div>
                    </div>
                </article>

                <article class="result-item">
                    <a href="#" class="place-thumbnail">
                        <img
                            src="./images/searchimg5.png"
                            alt="서귀포 돈내코"
                        >
                    </a>

                    <div class="place-content">
                        <h2 class="place-title">서귀포 돈내코</h2>

                        <p class="place-address">
                            제주특별자치도<br>
                            서귀포시 돈내코로 114
                        </p>

                        <button
                            type="button"
                            class="bookmark-button"
                            aria-label="서귀포 돈내코 저장"
                        >
                            <img
                                src="./icons/save.svg"
                                alt=""
                            >
                        </button>

                        <div class="place-bottom">
                            <div class="place-tags">
                                <span class="place-tag">이색</span>
                                <span class="place-tag">주차장</span>
                            </div>

                            <span class="place-distance">483km</span>
                        </div>
                    </div>
                </article>

                <article class="result-item">
                    <a href="#" class="place-thumbnail">
                        <img
                            src="./images/searchimg6.png"
                            alt="영종도 마시안해변"
                        >
                    </a>

                    <div class="place-content">
                        <h2 class="place-title">영종도 마시안해변</h2>

                        <p class="place-address">
                            덕교동 662-9
                        </p>

                        <button
                            type="button"
                            class="bookmark-button"
                            aria-label="영종도 마시안해변 저장"
                        >
                            <img
                                src="./icons/save.svg"
                                alt=""
                            >
                        </button>

                        <div class="place-bottom">
                            <div class="place-tags">
                                <span class="place-tag">수도권</span>
                                <span class="place-tag">주차장</span>
                            </div>

                            <span class="place-distance">32km</span>
                        </div>
                    </div>
                </article>

            </section>

        </div>

        <nav class="bottom-navigation" aria-label="하단 메뉴">

            <a href="./home.html" class="nav-item">
                <span class="nav-icon">
                    <img
                        src="./icons/homedeactive.svg"
                        alt=""
                    >
                </span>
                <span class="nav-label">홈</span>
            </a>

            <a href="./search.html" class="nav-item active">
                <span class="nav-icon">
                    <img
                        src="./icons/searchactive.svg"
                        alt=""
                    >
                </span>
                <span class="nav-label">검색</span>
            </a>

            <a href="#" class="nav-item">
                <span class="nav-icon">
                    <img
                        src="./icons/community.svg"
                        alt=""
                    >
                </span>
                <span class="nav-label">모임</span>
            </a>

            <a href="#" class="nav-item">
                <span class="nav-icon">
                    <img
                        src="./icons/live.svg"
                        alt=""
                    >
                </span>
                <span class="nav-label">LIVE</span>
            </a>

            <a href="#" class="nav-item">
                <span class="nav-icon">
                    <img
                        src="./icons/user.svg"
                        alt=""
                    >
                </span>
                <span class="nav-label">MY</span>
            </a>

        </nav>

    </main>

    <script>
        document
            .getElementById("backButton")
            .addEventListener("click", function () {
                history.back();
            });
    </script>
</body>
</html>
