<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0,
        maximum-scale=1.0, minimum-scale=1.0, user-scalable=no"
    >

    <title>CAMBA 온보딩</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            overflow: hidden;
            background-color: #ffffff;
            font-family: Arial, "Noto Sans KR", sans-serif;
        }

        button {
            border: 0;
            background: none;
            font: inherit;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .onboarding {
            position: relative;
            display: flex;
            flex-direction: column;
            width: 100%;

            /* 구형 브라우저용 기본값 */
            height: 100vh;

            /* 주소창과 하단 도구 모음이 표시된 작은 화면 높이 */
            height: 100svh;

            overflow: hidden;
            background-color: #ffffff;
        }

        .text-area {
            position: relative;
            z-index: 3;
            flex-shrink: 0;
            padding: clamp(38px, 10svh, 82px) 20px 0 24px;
        }

        .title {
            color: #3d558a;
            font-size: 29px;
            font-weight: 700;
            line-height: 1.35;
            letter-spacing: -1.5px;
        }

        .title-small {
            color: #6b83bc;
            font-size: 23px;
            font-weight: 700;
            letter-spacing: -1.3px;
        }

        .description {
            margin-top: 24px;
            color: #9caed8;
            font-size: 17px;
            font-weight: 500;
            line-height: 1.45;
            letter-spacing: -0.8px;
        }

        .visual-area {
            position: relative;
            flex: 1;
            width: 100%;
            min-height: 230px;
            margin-top: 20px;
            overflow: hidden;
        }

        .visual-background {
            position: absolute;
            top: 50%;
            left: 81px;
            width: 390px;
            height: 254px;
            border-radius: 55% 0 0 55%;
            background-color: #f0f2f9;
            transform: translateY(-50%) rotate(-7deg);
        }

        .visual-image {
            position: absolute;
            left: 50%;
            bottom: 0;
            display: block;
            width: min(69.06vw, 259px);
            height: auto;
            transform: translateX(-50%);
            z-index: 2;
        }

        .bottom-area {
            position: relative;
            z-index: 4;
            flex-shrink: 0;
            width: 100%;
            padding: 22px 24px 18px;
            background-color: #ffffff;
        }

        .pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: clamp(24px, 6svh, 48px);
        }

        .pagination span {
            display: block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #edf0f7;
        }

        .pagination .active {
            background-color: #5b78bd;
        }

        .start-button {
            display: block;
            width: 100%;
            height: 49px;
            border-radius: 11px;
            background-color: #5875b9;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .start-button a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
    <main class="onboarding">

        <section class="text-area">
            <h1 class="title">
                차박<br>
                어디로
                <span class="title-small">
                    떠나야 할지 모르겠나요
                </span>
            </h1>

            <p class="description">
                지도기반 위치 앱 및 키워드 검색으로 내가 원<br>
                하는 장소를 한번에
            </p>
        </section>

        <section class="visual-area">
            <div class="visual-background"></div>

            <img
                class="visual-image"
                src="./images/work1ill.svg"
                alt="스마트폰으로 차박 장소를 찾는 곰 캐릭터"
            >
        </section>

        <div class="bottom-area">
            <div class="pagination">
                <span class="active"></span>
                <span></span>
                <span></span>
            </div>

            <button type="button" class="start-button">
                <a href="./login.html">시작하기</a>
            </button>
        </div>

    </main>

    <script>
        setTimeout(function () {
            window.location.href = "./onboard2.html";
        }, 3000);
    </script>
</body>
</html>
