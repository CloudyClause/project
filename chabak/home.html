<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0,
        minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>CAMBAK 홈</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            overflow: hidden;
            background-color: #ffffff;
            color: #222222;
            font-family: Arial, "Noto Sans KR", sans-serif;
        }

        img {
            display: block;
            max-width: 100%;
        }

        button,
        a {
            border: 0;
            outline: 0;
            background: none;
            color: inherit;
            font: inherit;
            text-decoration: none;
        }

        .app {
            position: relative;
            width: 100%;
            height: 100svh;
            overflow: hidden;
            background-color: #ffffff;
        }

        .app-content {
            width: 100%;
            height: 100%;
            padding-bottom: calc(82px + env(safe-area-inset-bottom));
            overflow-x: hidden;
            overflow-y: auto;
            overscroll-behavior-y: contain;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .app-content::-webkit-scrollbar {
            display: none;
        }

        /* 상단 대표 이미지 */

        .hero {
            width: 100%;
            height: 285px;
            overflow: hidden;
            background-color: #eeeeee;
        }

        .hero img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        /* 공통 섹션 */

        .section {
            padding: 25px 24px 0;
        }

        .section-title {
            color: #526fb7;
            font-size: 19px;
            font-weight: 700;
            line-height: 1.3;
            letter-spacing: -0.7px;
        }

        /* 테마별 카테고리 */

        .category-list {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            row-gap: 22px;
            margin-top: 24px;
        }

        .category-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .category-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 34px;
        }

        .category-icon img {
            width: 34px;
            height: 34px;
            object-fit: contain;
        }

        .category-name {
            color: #555555;
            font-size: 14px;
            font-weight: 500;
            line-height: 1;
            white-space: nowrap;
        }

        /* 쿠폰·이벤트·혜택 */

        .quick-menu {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 24px;
        }

        .quick-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 42px;
            border-radius: 9px;
            background-color: #f0f3fa;
            color: #526fb7;
            font-size: 14px;
            font-weight: 700;
        }

        .quick-icon {
            width: 21px;
            height: 21px;
            object-fit: contain;
        }

        /* 장소 랭킹 */

        .ranking-section {
            padding-top: 24px;
        }

        .ranking-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 9px;
            margin-top: 22px;
        }

        .ranking-card {
            width: 100%;
            height: 205px;
            overflow: hidden;
            background-color: #eeeeee;
        }

        .ranking-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 장소 상세 카드 */

        .place-card {
            margin-top: 24px;
            padding-bottom: 80px;
        }

        .place-image {
            width: 100%;
            height: 198px;
            overflow: hidden;
            background-color: #eeeeee;
        }

        .place-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .place-info {
            padding-top: 24px;
        }

        .place-title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .place-title {
            color: #222222;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .bookmark-button {
            display: flex;
            flex-shrink: 0;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 28px;
            cursor: pointer;
        }

        .bookmark-button img {
            width: 20px;
            height: 24px;
            object-fit: contain;
        }

        .place-address {
            margin-top: 24px;
            color: #666666;
            font-size: 13px;
            line-height: 1.4;
            letter-spacing: -0.3px;
        }

        .place-buttons {
            display: grid;
            grid-template-columns: 1.4fr 0.95fr;
            gap: 18px;
            margin-top: 22px;
        }

        .route-button,
        .cancel-button {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 49px;
            border-radius: 9px;
            font-size: 16px;
            font-weight: 700;
        }

        .route-button {
            background-color: #526fb7;
            color: #ffffff;
        }

        .cancel-button {
            border: 1px solid #526fb7;
            background-color: #ffffff;
            color: #222222;
        }

        /* 하단 내비게이션 */

        .bottom-navigation {
            position: absolute;
            right: 0;
            bottom: 0;
            left: 0;
            z-index: 20;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            width: 100%;
            height: calc(82px + env(safe-area-inset-bottom));
            padding-bottom: env(safe-area-inset-bottom);
            border-top: 1px solid #eeeeee;
            background-color: #ffffff;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            color: #111111;
        }

        .nav-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
        }

        .nav-icon img {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }

        .nav-label {
            font-size: 15px;
            font-weight: 600;
            line-height: 1;
        }

        .nav-item.active {
            color: #526fb7;
        }
    </style>
</head>

<body>
    <main class="app">

        <div class="app-content">

            <section class="hero">
                <img
                    src="./images/main.svg"
                    alt="캠핑카를 운전하는 곰 캐릭터"
                >
            </section>

            <section class="section category-section">
                <h1 class="section-title">테마별 카테고리</h1>

                <div class="category-list">

                    <a href="#" class="category-item">
                        <span class="category-icon">
                            <img
                                src="./icons/flowers.svg"
                                alt=""
                            >
                        </span>
                        <span class="category-name">꽃놀이</span>
                    </a>

                    <a href="#" class="category-item">
                        <span class="category-icon">
                            <img
                                src="./icons/fire.svg"
                                alt=""
                            >
                        </span>
                        <span class="category-name">불멍</span>
                    </a>

                    <a href="#" class="category-item">
                        <span class="category-icon">
                            <img
                                src="./icons/city.svg"
                                alt=""
                            >
                        </span>
                        <span class="category-name">도심</span>
                    </a>

                    <a href="#" class="category-item">
                        <span class="category-icon">
                            <img
                                src="./icons/star.svg"
                                alt=""
                            >
                        </span>
                        <span class="category-name">별감상</span>
                    </a>

                    <a href="#" class="category-item">
                        <span class="category-icon">
                            <img
                                src="./icons/dog.svg"
                                alt=""
                            >
                        </span>
                        <span class="category-name">반려견</span>
                    </a>

                    <a href="#" class="category-item">
                        <span class="category-icon">
                            <img
                                src="./icons/mountain.svg"
                                alt=""
                            >
                        </span>
                        <span class="category-name">오지</span>
                    </a>

                    <a href="#" class="category-item">
                        <span class="category-icon">
                            <img
                                src="./icons/bbq.svg"
                                alt=""
                            >
                        </span>
                        <span class="category-name">바베큐</span>
                    </a>

                    <a href="#" class="category-item">
                        <span class="category-icon">
                            <img
                                src="./icons/camp.svg"
                                alt=""
                            >
                        </span>
                        <span class="category-name">장비</span>
                    </a>

                </div>

                <div class="quick-menu">

                    <a href="#" class="quick-button">
                        <img
                            class="quick-icon"
                            src="./icons/coupon.svg"
                            alt=""
                        >
                        <span>쿠폰</span>
                    </a>

                    <a href="#" class="quick-button">
                        <img
                            class="quick-icon"
                            src="./icons/event.svg"
                            alt=""
                        >
                        <span>이벤트</span>
                    </a>

                    <a href="#" class="quick-button">
                        <img
                            class="quick-icon"
                            src="./icons/gift.svg"
                            alt=""
                        >
                        <span>혜택</span>
                    </a>

                </div>
            </section>

            <section class="section ranking-section">
                <h2 class="section-title">장소 랭킹 Top 10</h2>

                <div class="ranking-grid">

                    <a href="#" class="ranking-card">
                        <img
                            src="./images/homeimg1.jpg"
                            alt="캠핑카 옆에 서 있는 가족"
                        >
                    </a>

                    <a href="#" class="ranking-card">
                        <img
                            src="./images/homeimg2.jpg"
                            alt="숲속에 주차된 캠핑카"
                        >
                    </a>

                </div>

                <article class="place-card">
                    <div class="place-image">
                        <img
                            src="./images/homeimg3.jpg"
                            alt="숲속 캠핑장과 해먹"
                        >
                    </div>

                    <div class="place-info">
                        <div class="place-title-row">
                            <h3 class="place-title">테마별 카테고리</h3>

                            <button
                                type="button"
                                class="bookmark-button"
                                aria-label="장소 저장"
                            >
                                <img
                                    src="./icons/save.svg"
                                    alt=""
                                >
                            </button>
                        </div>

                        <p class="place-address">
                            강원도 원주시 치악면 치악산 1번지
                        </p>

                        <div class="place-buttons">
                            <a href="#" class="route-button">
                                길찾기
                            </a>

                            <button type="button" class="cancel-button">
                                해제하기
                            </button>
                        </div>
                    </div>
                </article>
            </section>

        </div>

        <nav class="bottom-navigation" aria-label="하단 메뉴">

            <a href="#" class="nav-item active">
                <span class="nav-icon">
                    <img
                        src="./icons/home.svg"
                        alt=""
                    >
                </span>
                <span class="nav-label">홈</span>
            </a>

            <a href="#" class="nav-item">
                <span class="nav-icon">
                    <img
                        src="./icons/search.svg"
                        alt=""
                    >
                </span>
                <span class="nav-label">검색</span>
            </a>

            <a href="#" class="nav-item">
                <span class="nav-icon">
                    <img
                        src="./icons/community.svg"
                        alt=""
                    >
                </span>
                <span class="nav-label">모임</span>
            </a>

            <a href="#" class="nav-item">
                <span class="nav-icon">
                    <img
                        src="./icons/live.svg"
                        alt=""
                    >
                </span>
                <span class="nav-label">LIVE</span>
            </a>

            <a href="#" class="nav-item">
                <span class="nav-icon">
                    <img
                        src="./icons/user.svg"
                        alt=""
                    >
                </span>
                <span class="nav-label">MY</span>
            </a>

        </nav>

    </main>
</body>
</html>
