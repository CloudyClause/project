<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0,
        minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>CAMBAK 로그인</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            overflow: hidden;
            background-color: #ffffff;
            color: #405b9b;
            font-family: Arial, "Noto Sans KR", sans-serif;
        }

        button,
        input {
            border: 0;
            outline: 0;
            background: none;
            font: inherit;
        }

        button,
        a {
            color: inherit;
            text-decoration: none;
        }

        .login-page {
            position: relative;
            width: 100%;
            height: 100vh;
            min-height: 812px;
            overflow: hidden;
            background-color: #ffffff;
        }

        .logo-area {
            position: absolute;
            top: 103px;
            left: 50%;
            width: 135px;
            transform: translateX(-50%);
        }

        .logo-area img {
            display: block;
            width: 100%;
            height: auto;
        }

        .login-form {
            position: absolute;
            top: 247px;
            left: 24px;
            width: calc(100% - 48px);
        }

        .input-group {
            width: 100%;
            margin-bottom: 17px;
        }

        .input-label {
            display: block;
            margin-bottom: 10px;
            color: #4563aa;
            font-size: 15px;
            font-weight: 700;
            line-height: 1;
        }

        .input-field {
            width: 100%;
            height: 35px;
            padding: 0 2px;
            border-bottom: 1px solid #d7d7d7;
            color: #333333;
            font-size: 15px;
            font-weight: 400;
        }

        .input-field::placeholder {
            color: #b8b8b8;
            opacity: 1;
        }

        .input-field:focus {
            border-bottom-color: #5674bb;
        }

        .button-area {
            margin-top: 32px;
        }

        .login-button,
        .join-button {
            width: 100%;
            height: 48px;
            border-radius: 11px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .login-button {
            background-color: #5674bb;
            color: #ffffff;
        }

        .join-button {
            margin-top: 8px;
            border: 1px solid #5674bb;
            background-color: #ffffff;
            color: #4563aa;
        }

        .account-menu {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 15px;
            color: #50679d;
            font-size: 13px;
        }

        .account-menu a {
            padding: 0 14px;
        }

        .account-menu span {
            color: #91a1c5;
        }

        .social-login {
            margin-top: 35px;
        }

        .social-title {
            display: flex;
            align-items: center;
            gap: 14px;
            color: #50679d;
            font-size: 13px;
            font-weight: 500;
        }

        .social-title::before,
        .social-title::after {
            content: "";
            flex: 1;
            height: 1px;
            background-color: #6f87bd;
        }

        .social-icons {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 32px;
            margin-top: 24px;
        }

        .social-button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            cursor: pointer;
        }

        .social-button img {
            display: block;
            max-width: 24px;
            max-height: 24px;
        }
    </style>
</head>

<body>
    <main class="login-page">

        <div class="logo-area">
            <img
                src="./images/logo.svg"
                alt="CAMBAK"
            >
        </div>

        <form class="login-form" action="#" method="post">

            <div class="input-group">
                <label class="input-label" for="user-id">
                    아이디
                </label>

                <input
                    class="input-field"
                    type="text"
                    id="user-id"
                    name="user-id"
                    placeholder="아이디를 입력해주세요"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="input-group">
                <label class="input-label" for="password">
                    비밀번호
                </label>

                <input
                    class="input-field"
                    type="password"
                    id="password"
                    name="password"
                    placeholder="비밀번호를 입력해주세요"
                    autocomplete="current-password"
                    required
                >
            </div>

            <div class="button-area">
                <button type="submit" class="login-button">
                    로그인
                </button>

                <button type="button" class="join-button">
                    회원가입
                </button>
            </div>

            <nav class="account-menu">
                <a href="#">아이디 찾기</a>
                <span>|</span>
                <a href="#">비밀번호 찾기</a>
                <span>|</span>
                <a href="#">둘러보기</a>
            </nav>

            <section class="social-login">
                <p class="social-title">간편로그인</p>

                <div class="social-icons">
                    <button type="button" class="social-button">
                        <img
                            src="./images/kakao.png"
                            alt="카카오 로그인"
                        >
                    </button>

                    <button type="button" class="social-button">
                        <img
                            src="./images/naver.png"
                            alt="네이버 로그인"
                        >
                    </button>

                    <button type="button" class="social-button">
                        <img
                            src="./images/google.png"
                            alt="구글 로그인"
                        >
                    </button>

                    <button type="button" class="social-button">
                        <img
                            src="./images/facebook.png"
                            alt="페이스북 로그인"
                        >
                    </button>
                </div>
            </section>

        </form>

    </main>
</body>
</html>
