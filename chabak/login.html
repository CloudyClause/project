<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0,
        minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>CAMBAK 로그인</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            overflow: hidden;
            background-color: #ffffff;
            color: #405b9b;
            font-family: Arial, "Noto Sans KR", sans-serif;
        }

        button,
        input {
            border: 0;
            outline: 0;
            background: none;
            font: inherit;
        }

        button,
        a {
            color: inherit;
            text-decoration: none;
        }

        .login-page {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;

            /* 구형 모바일 브라우저 대체값 */
            height: 100vh;

            /* 모바일 Chrome 주소창과 하단 도구 모음 반영 */
            height: 100svh;

            padding:
                clamp(45px, 10svh, 82px)
                24px
                max(24px, env(safe-area-inset-bottom));

            overflow-x: hidden;
            overflow-y: auto;
            background-color: #ffffff;
        }

        .logo-area {
            flex-shrink: 0;
            width: 135px;
        }

        .logo-area img {
            display: block;
            width: 100%;
            height: auto;
        }

        .login-form {
            flex-shrink: 0;
            width: 100%;
            margin-top: clamp(48px, 8svh, 78px);
        }

        .input-group {
            width: 100%;
            margin-bottom: 17px;
        }

        .input-label {
            display: block;
            margin-bottom: 10px;
            color: #4563aa;
            font-size: 15px;
            font-weight: 700;
            line-height: 1;
        }

        .input-field {
            width: 100%;
            height: 35px;
            padding: 0 2px;
            border-bottom: 1px solid #d7d7d7;
            border-radius: 0;
            color: #333333;
            font-size: 15px;
            font-weight: 400;
        }

        .input-field::placeholder {
            color: #b8b8b8;
            opacity: 1;
        }

        .input-field:focus {
            border-bottom-color: #5674bb;
        }

        .button-area {
            margin-top: clamp(24px, 4svh, 32px);
        }

        .login-button,
        .join-button {
            display: block;
            width: 100%;
            height: 48px;
            border-radius: 11px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .login-button {
            background-color: #5674bb;
            color: #ffffff;
        }

        .join-button {
            margin-top: 8px;
            border: 1px solid #5674bb;
            background-color: #ffffff;
            color: #4563aa;
        }

        .account-menu {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 15px;
            color: #50679d;
            font-size: 13px;
            white-space: nowrap;
        }

        .account-menu a {
            padding: 0 12px;
        }

        .account-menu span {
            color: #91a1c5;
        }

        .social-login {
            margin-top: clamp(28px, 5svh, 35px);
            padding-bottom: 10px;
        }

        .social-title {
            display: flex;
            align-items: center;
            gap: 14px;
            color: #50679d;
            font-size: 13px;
            font-weight: 500;
        }

        .social-title::before,
        .social-title::after {
            content: "";
            flex: 1;
            height: 1px;
            background-color: #6f87bd;
        }

        .social-icons {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 32px;
            margin-top: 24px;
        }

        .social-button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            cursor: pointer;
        }

        .social-button img {
            display: block;
            width: 24px;
            height: 24px;
            object-fit: contain;
        }
    </style>
</head>

<body>
    <main class="login-page">

        <div class="logo-area">
            <img
                src="./images/logo.svg"
                alt="CAMBAK"
            >
        </div>

        <form class="login-form" action="./home.html" method="get">

            <div class="input-group">
                <label class="input-label" for="user-id">
                    아이디
                </label>

                <input
                    class="input-field"
                    type="text"
                    id="user-id"
                    name="user-id"
                    placeholder="아이디를 입력해주세요"
                    autocomplete="username"
                
                >
            </div>

            <div class="input-group">
                <label class="input-label" for="password">
                    비밀번호
                </label>

                <input
                    class="input-field"
                    type="password"
                    id="password"
                    name="password"
                    placeholder="비밀번호를 입력해주세요"
                    autocomplete="current-password"
                
                >
            </div>

            <div class="button-area">
                <button type="submit" class="login-button">
                    로그인
                </button>

                <button type="button" class="join-button">
                    회원가입
                </button>
            </div>

            <nav class="account-menu">
                <a href="#">아이디 찾기</a>
                <span>|</span>
                <a href="#">비밀번호 찾기</a>
                <span>|</span>
                <a href="#">둘러보기</a>
            </nav>

            <section class="social-login">
                <p class="social-title">간편로그인</p>

                <div class="social-icons">
                    <button type="button" class="social-button">
                        <img
                            src="./images/kakao.png"
                            alt="카카오 로그인"
                        >
                    </button>

                    <button type="button" class="social-button">
                        <img
                            src="./images/naver.png"
                            alt="네이버 로그인"
                        >
                    </button>

                    <button type="button" class="social-button">
                        <img
                            src="./images/google.png"
                            alt="구글 로그인"
                        >
                    </button>

                    <button type="button" class="social-button">
                        <img
                            src="./images/facebook.png"
                            alt="페이스북 로그인"
                        >
                    </button>
                </div>
            </section>

        </form>

    </main>
</body>
</html>
