<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0,
        maximum-scale=1.0, minimum-scale=1.0, user-scalable=no"
    >

    <title>camba Splash</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            overflow: hidden;
            background-color: #ffffff;
        }

        .splash {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background-color: #ffffff;
        }

        .splash-logo {
            position: absolute;
            top: 50%;
            left: 50%;
            display: block;
            width: 150px;
            height: auto;
            transform: translate(-50%, -50%);
        }
    </style>
</head>

<body>
    <main class="splash">
        <img
            class="splash-logo"
            src="./images/logo.svg"
            alt="camba"
        >
    </main>
</body>
</html>
