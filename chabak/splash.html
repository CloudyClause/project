<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0,
        maximum-scale=1.0, minimum-scale=1.0, user-scalable=no"
    >

    <title>camba Splash</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            overflow: hidden;
            background-color: #ffffff;
        }

        .splash {
            position: relative;
            width: 100%;

            /* 구형 모바일 브라우저 대체값 */
            height: 100vh;

            /* 모바일 Chrome의 주소창과 하단 도구 모음이 보이는 높이 */
            height: 100svh;

            overflow: hidden;
            background-color: #ffffff;
        }

        .splash-logo {
            position: absolute;
            top: 50%;
            left: 50%;
            display: block;
            width: 150px;
            height: auto;
            transform: translate(-50%, -50%);
        }
    </style>
</head>

<body>
    <main class="splash">
        <img
            class="splash-logo"
            src="./images/logo.svg"
            alt="camba"
        >
    </main>

    <script>
        setTimeout(function () {
            window.location.href = "./onboard1.html";
        }, 3000);
    </script>
</body>
</html>
