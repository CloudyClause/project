<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>순서 없는 목록 박스</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background-color: #ffffff;
    }

    ul {
      display: flex;
      gap: 20px;

      width: 1000px;
      height: 300px;

      margin: 0 auto;
      padding: 0;

      border: 5px solid #000000;
      background-color: #ffffff;

      list-style: none;
    }

    li {
      flex: 1;
      height: 100%;

      background-color: #ffff00;
      color: #000000;

      font-size: 14px;
    }
  </style>
</head>

<body>
  <ul>
    <li>박스1</li>
    <li>박스2</li>
    <li>박스3</li>
  </ul>
</body>
</html>
