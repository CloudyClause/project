<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>이어타고 - 경로 안내</title>

  <style>
    :root {
      --primary-navy: #061a3d;
      --primary-blue: #005bff;
      --text-primary: #111827;
      --text-secondary: #6b7280;
      --border-gray: #d7dee8;
      --surface-white: #ffffff;
      --tabbar-height: 94px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: var(--surface-white);
      font-family:
        "Pretendard",
        "Noto Sans KR",
        "Apple SD Gothic Neo",
        Arial,
        sans-serif;
    }

    body {
      overflow-x: hidden;
    }

    button,
    a {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: 100%;
      min-height: 100svh;
      padding: 39px 24px calc(var(--tabbar-height) + 18px);
      background: var(--surface-white);
    }

    /* 상단 헤더 */
    .page-header {
      position: relative;
      width: 100%;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .back-button {
      position: absolute;
      top: 0;
      left: -7px;
      width: 44px;
      height: 44px;
      border: 0;
      background: transparent;
    }

    .back-button::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 11px;
      width: 18px;
      height: 18px;
      border-left: 2px solid var(--primary-navy);
      border-bottom: 2px solid var(--primary-navy);
      transform: translateY(-50%) rotate(45deg);
    }

    .back-button::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 11px;
      width: 27px;
      height: 2px;
      background: var(--primary-navy);
      transform: translateY(-50%);
    }

    .page-title {
      color: var(--primary-navy);
      font-size: 24px;
      line-height: 32px;
      font-weight: 800;
      letter-spacing: -0.8px;
    }

    /* 경로 요약 */
    .route-summary {
      width: 100%;
      margin-top: 6px;
      text-align: center;
    }

    .route-title {
      color: #000000;
      font-size: 24px;
      line-height: 32px;
      font-weight: 800;
      letter-spacing: -0.8px;
    }

    .route-time {
      margin-top: 3px;
      color: #000000;
      font-size: 15px;
      line-height: 22px;
      font-weight: 700;
    }

    /* 단계 표시 */
    .step-indicator {
      width: 100%;
      margin-top: 8px;
    }

    .step-track {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      align-items: center;
      padding: 0 28px;
    }

    .step {
      position: relative;
      display: flex;
      justify-content: center;
    }

    .step:not(:last-child)::after {
      content: "";
      position: absolute;
      top: 10px;
      left: calc(50% + 11px);
      width: calc(100% - 22px);
      height: 1px;
      background: #111111;
    }

    .step-circle {
      position: relative;
      z-index: 2;
      width: 22px;
      height: 22px;
      border: 1.5px solid #111111;
      border-radius: 50%;
      background: var(--surface-white);
      color: #111111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      line-height: 1;
      font-weight: 700;
    }

    .step.active .step-circle {
      border-color: var(--primary-blue);
      background: var(--primary-blue);
      color: #ffffff;
    }

    .step-labels {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      margin-top: 8px;
      padding: 0 14px;
      text-align: center;
    }

    .step-label {
      color: #111111;
      font-size: 13px;
      line-height: 18px;
      font-weight: 500;
    }

    /* 안내 목록 */
    .guide-list {
      width: 100%;
      margin-top: 12px;
      border: 1px solid var(--border-gray);
      background: var(--surface-white);
    }

    .guide-item {
      min-height: 67px;
      padding: 8px 14px;
      border-bottom: 1px solid var(--border-gray);
      display: flex;
      align-items: center;
    }

    .guide-item:last-child {
      border-bottom: 0;
    }

    .guide-icon {
      width: 46px;
      height: 46px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .guide-icon img {
      width: 32px;
      height: 32px;
      object-fit: contain;
    }

    .guide-content {
      min-width: 0;
      margin-left: 14px;
    }

    .guide-title {
      color: var(--primary-navy);
      font-size: 20px;
      line-height: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .guide-description {
      margin-top: 3px;
      color: var(--text-secondary);
      font-size: 15px;
      line-height: 21px;
      font-weight: 500;
      letter-spacing: -0.3px;
    }

    /* 지도 */
    .map-card {
      width: calc(100% - 34px);
      height: 141px;
      margin: 18px auto 0;
      border: 1px solid var(--border-gray);
      border-radius: 16px;
      overflow: hidden;
      background: #eef7ff;
    }

    .map-image {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    /* 모바일 티켓 버튼 */
    .ticket-button {
      width: 100%;
      min-height: 52px;
      margin-top: 16px;
      border: 0;
      border-radius: 15px;
      background: var(--primary-blue);
      color: #ffffff;
      font-size: 17px;
      line-height: 24px;
      font-weight: 700;
    }

    .ticket-button:active {
      background: #0048cc;
    }

    /* 공통 하단 탭바 */
    .bottom-tabbar {
      position: fixed;
      left: 0;
      bottom: 0;
      z-index: 100;
      width: 100%;
      height: var(--tabbar-height);
      padding: 12px 14px 13px;
      border-top: 1px solid var(--border-gray);
      background: var(--surface-white);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
    }

    .tab-item {
      min-width: 0;
      min-height: 60px;
      border: 0;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 7px;
      color: var(--text-secondary);
      text-decoration: none;
    }

    .tab-item img {
      width: 24px;
      height: 24px;
      object-fit: contain;
    }

    .tab-label {
      font-size: 11px;
      line-height: 14px;
      font-weight: 500;
    }

    .tab-item.active {
      color: var(--primary-blue);
    }

    .tab-item.active .tab-label {
      font-weight: 700;
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="page-header">
      <button
        type="button"
        class="back-button"
        aria-label="이전 화면으로 이동"
      ></button>

      <h1 class="page-title">경로 안내</h1>
    </header>

    <section class="route-summary">
      <h2 class="route-title">서울역 → 강남역</h2>
      <p class="route-time">예상 소요 시간 24분</p>
    </section>

    <section class="step-indicator" aria-label="이동 단계">
      <div class="step-track">
        <div class="step active">
          <span class="step-circle">1</span>
        </div>

        <div class="step">
          <span class="step-circle">2</span>
        </div>

        <div class="step">
          <span class="step-circle">3</span>
        </div>

        <div class="step">
          <span class="step-circle">4</span>
        </div>
      </div>

      <div class="step-labels">
        <span class="step-label">출발지</span>
        <span class="step-label">탑승</span>
        <span class="step-label">이동중</span>
        <span class="step-label">도착지</span>
      </div>
    </section>

    <section class="guide-list">
      <article class="guide-item">
        <div class="guide-icon">
          <img
            src="./icons/qrcode.svg"
            alt="개찰구"
          />
        </div>

        <div class="guide-content">
          <h3 class="guide-title">개찰구</h3>
          <p class="guide-description">
            서울역 2번 출구 개찰구 이용
          </p>
        </div>
      </article>

      <article class="guide-item">
        <div class="guide-icon">
          <img
            src="./icons/belldeactive.svg"
            alt="승강장"
          />
        </div>

        <div class="guide-content">
          <h3 class="guide-title">승강장</h3>
          <p class="guide-description">
            2호선 승강장으로 이동
          </p>
        </div>
      </article>

      <article class="guide-item">
        <div class="guide-icon">
          <img
            src="./icons/routedeactive.svg"
            alt="열차 방향"
          />
        </div>

        <div class="guide-content">
          <h3 class="guide-title">열차 방향</h3>
          <p class="guide-description">
            강남역 방면 열차 탑승
          </p>
        </div>
      </article>

      <article class="guide-item">
        <div class="guide-icon">
          <img
            src="./icons/arrival.svg"
            alt="하차 위치"
          />
        </div>

        <div class="guide-content">
          <h3 class="guide-title">하차 위치</h3>
          <p class="guide-description">
            강남역 6-2번 출구 하차
          </p>
        </div>
      </article>
    </section>

    <div class="map-card">
      <img
        src="./images/routeimg.png"
        alt="서울역에서 강남역까지의 경로 지도"
        class="map-image"
      />
    </div>

    <button type="button" class="ticket-button">
      모바일 티켓 보기
    </button>
  </main>

  <!-- 공통 하단 탭바 -->
  <nav class="bottom-tabbar" aria-label="주요 메뉴">
    <a href="./home.html" class="tab-item">
      <img src="./icons/homedeactive.svg" alt="홈 화면" />
      <span class="tab-label">홈</span>
    </a>

    <a href="./prepare.html" class="tab-item">
      <img src="./icons/ticketdeactive.svg" alt="발급준비" />
      <span class="tab-label">발급준비</span>
    </a>

    <a href="./route.html" class="tab-item active">
      <img src="./icons/routeactive.svg" alt="경로안내" />
      <span class="tab-label">경로안내</span>
    </a>

    <a href="./myinfo.html" class="tab-item">
      <img src="./icons/userdeactive.svg" alt="내 정보" />
      <span class="tab-label">내 정보</span>
    </a>
  </nav>
  <script>
  const backButton = document.querySelector(".back-button");
  const ticketButton = document.querySelector(".ticket-button");

  backButton.addEventListener("click", function () {
    window.history.back();
  });

  ticketButton.addEventListener("click", function () {
    window.location.href = "./detail.html";
  });
  </script>
</body>
</html>
