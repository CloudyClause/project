<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>이어타고 - 결제수단 선택</title>

  <style>
    :root {
      --primary-navy: #061a3d;
      --primary-blue: #005bff;
      --text-primary: #111827;
      --text-secondary: #6b7280;
      --border-gray: #687386;
      --light-border: #e5e7eb;
      --surface-white: #ffffff;

      --radius-card: 16px;
      --tabbar-height: 94px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: var(--surface-white);
      font-family:
        "Pretendard",
        "Noto Sans KR",
        "Apple SD Gothic Neo",
        Arial,
        sans-serif;
    }

    body {
      overflow-x: hidden;
    }

    button,
    input,
    a {
      font: inherit;
    }

    button,
    a,
    label {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: 100%;
      min-height: 100svh;
      padding: 46px 24px calc(var(--tabbar-height) + 18px);
      background: var(--surface-white);
    }

    /* 상단 헤더 */
    .page-header {
      position: relative;
      width: 100%;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .back-button {
      position: absolute;
      top: 2px;
      left: -8px;
      width: 44px;
      height: 44px;
      border: 0;
      background: transparent;
    }

    .back-button::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 10px;
      width: 18px;
      height: 18px;
      border-left: 2px solid var(--primary-navy);
      border-bottom: 2px solid var(--primary-navy);
      transform: translateY(-50%) rotate(45deg);
    }

    .back-button::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 10px;
      width: 27px;
      height: 2px;
      background: var(--primary-navy);
      transform: translateY(-50%);
    }

    .page-title {
      color: var(--primary-navy);
      font-size: 24px;
      line-height: 32px;
      font-weight: 800;
      letter-spacing: -0.8px;
    }

    /* 결제 금액 */
    .amount-section {
      width: 100%;
      margin-top: 34px;
      padding: 0 16px 15px;
      border-bottom: 1px solid var(--light-border);
    }

    .amount-label {
      color: var(--text-primary);
      font-size: 17px;
      line-height: 24px;
      font-weight: 700;
    }

    .amount-value {
      margin-top: 7px;
      color: var(--primary-navy);
      font-size: 31px;
      line-height: 38px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .amount-unit {
      margin-left: 5px;
      color: var(--primary-navy);
      font-size: 15px;
      line-height: 22px;
      font-weight: 700;
    }

    /* 결제수단 영역 */
    .payment-section {
      width: 100%;
      margin-top: 18px;
    }

    .section-title {
      color: var(--primary-navy);
      font-size: 23px;
      line-height: 31px;
      font-weight: 800;
      letter-spacing: -0.8px;
    }

    .payment-list {
      width: 100%;
      margin-top: 24px;
    }

    .payment-option {
      position: relative;
      width: 100%;
      min-height: 68px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      border: 1px solid var(--border-gray);
      border-radius: var(--radius-card);
      background: var(--surface-white);
      cursor: pointer;
    }

    .payment-option + .payment-option {
      margin-top: 16px;
    }

    .payment-option input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .custom-radio {
      position: relative;
      width: 23px;
      height: 23px;
      flex-shrink: 0;
      border: 2px solid var(--text-secondary);
      border-radius: 50%;
      background: var(--surface-white);
    }

    .custom-radio::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--primary-blue);
      transform: translate(-50%, -50%);
      opacity: 0;
    }

    .payment-option input:checked + .custom-radio {
      border-color: var(--primary-blue);
    }

    .payment-option input:checked + .custom-radio::after {
      opacity: 1;
    }

    .payment-label {
      margin-left: 10px;
      color: var(--text-secondary);
      font-size: 17px;
      line-height: 24px;
      font-weight: 600;
      letter-spacing: -0.4px;
    }

    .payment-logo {
      width: 34px;
      height: 34px;
      margin-left: auto;
      object-fit: contain;
    }

    .payment-logo.card {
      width: 33px;
      height: 27px;
    }

    .payment-logo.naver {
      width: 27px;
      height: 27px;
    }

    .payment-logo.kakao {
      width: 52px;
      height: 33px;
    }

    .payment-logo.toss {
      width: 34px;
      height: 34px;
    }

    /* 선택 완료 버튼 */
    .complete-button {
      width: 100%;
      min-height: 52px;
      margin-top: 34px;
      border: 0;
      border-radius: 15px;
      background: var(--primary-blue);
      color: #ffffff;
      font-size: 17px;
      line-height: 24px;
      font-weight: 700;
    }

    .complete-button:active {
      background: #0048cc;
    }

    /* 공통 하단 탭바 */
    .bottom-tabbar {
      position: fixed;
      left: 0;
      bottom: 0;
      z-index: 100;
      width: 100%;
      height: var(--tabbar-height);
      padding: 12px 14px 13px;
      border-top: 1px solid var(--border-gray);
      background: var(--surface-white);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
    }

    .tab-item {
      min-width: 0;
      min-height: 60px;
      border: 0;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 7px;
      color: var(--text-secondary);
      text-decoration: none;
    }

    .tab-item img {
      width: 24px;
      height: 24px;
      object-fit: contain;
    }

    .tab-label {
      font-size: 11px;
      line-height: 14px;
      font-weight: 500;
    }

    .tab-item.active {
      color: var(--primary-blue);
    }

    .tab-item.active .tab-label {
      font-weight: 700;
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="page-header">
      <button
        type="button"
        class="back-button"
        aria-label="이전 화면으로 이동"
      ></button>

      <h1 class="page-title">결제수단 선택</h1>
    </header>

    <section class="amount-section">
      <p class="amount-label">결제 금액</p>

      <p class="amount-value">
        2,150<span class="amount-unit">원</span>
      </p>
    </section>

    <section class="payment-section">
      <h2 class="section-title">결제수단 선택</h2>

      <div class="payment-list">
        <label class="payment-option">
          <input
            type="radio"
            name="payment-method"
            value="card"
            checked
          />

          <span class="custom-radio"></span>
          <span class="payment-label">신용/체크카드</span>

          <img
            src="./icons/payment.svg"
            alt="신용카드"
            class="payment-logo card"
          />
        </label>

        <label class="payment-option">
          <input
            type="radio"
            name="payment-method"
            value="naverpay"
          />

          <span class="custom-radio"></span>
          <span class="payment-label">네이버페이</span>

          <img
            src="./icons/naverpay.svg"
            alt="네이버페이"
            class="payment-logo naver"
          />
        </label>

        <label class="payment-option">
          <input
            type="radio"
            name="payment-method"
            value="kakaopay"
          />

          <span class="custom-radio"></span>
          <span class="payment-label">카카오페이</span>

          <img
            src="./icons/kakaopay.svg"
            alt="카카오페이"
            class="payment-logo kakao"
          />
        </label>

        <label class="payment-option">
          <input
            type="radio"
            name="payment-method"
            value="tosspay"
          />

          <span class="custom-radio"></span>
          <span class="payment-label">토스페이</span>

          <img
            src="./icons/tosspay.svg"
            alt="토스페이"
            class="payment-logo toss"
          />
        </label>
      </div>
    </section>

    <button type="button" class="complete-button">
      선택 완료
    </button>
  </main>

  <!-- 공통 하단 탭바 -->
  <nav class="bottom-tabbar" aria-label="주요 메뉴">
    <a href="./home.html" class="tab-item">
      <img src="./icons/homedeactive.svg" alt="홈 화면" />
      <span class="tab-label">홈</span>
    </a>

    <a href="./prepare.html" class="tab-item active">
      <img src="./icons/ticketactive.svg" alt="발급준비" />
      <span class="tab-label">발급준비</span>
    </a>

    <a href="./route.html" class="tab-item">
      <img src="./icons/routedeactive.svg" alt="경로안내" />
      <span class="tab-label">경로안내</span>
    </a>

    <a href="./myinfo.html" class="tab-item">
      <img src="./icons/userdeactive.svg" alt="내 정보" />
      <span class="tab-label">내 정보</span>
    </a>
  </nav>
  <script>
    const backButton = document.querySelector(".back-button");
    const completeButton = document.querySelector(".complete-button");

    backButton.addEventListener("click", function () {
      window.history.back();
    });

    completeButton.addEventListener("click", function () {
      window.location.href = "./finalcheck.html";
    });
  </script>
</body>
</html>
