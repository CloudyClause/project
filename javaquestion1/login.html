<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>이어타고 - 로그인</title>

  <style>
    :root {
      --primary-navy: #061a3d;
      --primary-blue: #005bff;
      --text-primary: #111827;
      --text-secondary: #6b7280;
      --border-gray: #687386;
      --line-gray: #9ca3af;
      --surface-white: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: var(--surface-white);
      font-family:
        "Pretendard",
        "Noto Sans KR",
        "Apple SD Gothic Neo",
        Arial,
        sans-serif;
    }

    body {
      overflow-x: hidden;
    }

    button,
    input,
    a {
      font: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      width: 100%;
      min-height: 100svh;
      padding: 76px 21px 40px;
      background: var(--surface-white);
    }

    .login-header {
      width: 100%;
      text-align: center;
    }

    .login-title {
      color: var(--primary-navy);
      font-size: 24px;
      line-height: 32px;
      font-weight: 800;
      letter-spacing: -0.8px;
    }

    .login-description {
      margin-top: 12px;
      color: var(--text-secondary);
      font-size: 14px;
      line-height: 22px;
      font-weight: 400;
      letter-spacing: -0.3px;
    }

    .login-form {
      width: 100%;
      margin-top: 30px;
    }

    .input-group {
      position: relative;
      width: 100%;
      height: 56px;
    }

    .input-group + .input-group {
      margin-top: 16px;
    }

    .input-field {
      width: 100%;
      height: 100%;
      border: 1px solid var(--border-gray);
      border-radius: 8px;
      background: var(--surface-white);
      padding: 0 48px 0 54px;
      color: var(--text-primary);
      font-size: 16px;
      line-height: 24px;
      outline: none;
    }

    .input-field::placeholder {
      color: var(--text-secondary);
      opacity: 1;
    }

    .input-field:focus {
      border: 2px solid var(--primary-blue);
    }

    .input-icon {
      position: absolute;
      top: 50%;
      left: 18px;
      width: 22px;
      height: 22px;
      transform: translateY(-50%);
      object-fit: contain;
      pointer-events: none;
    }

    .password-toggle {
      position: absolute;
      top: 50%;
      right: 14px;
      width: 44px;
      height: 44px;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .password-toggle img {
      width: 23px;
      height: 23px;
      object-fit: contain;
    }

    .keep-login {
      display: flex;
      align-items: center;
      min-height: 44px;
      margin-top: 8px;
      cursor: pointer;
    }

    .keep-login input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .custom-checkbox {
      width: 20px;
      height: 20px;
      border: 2px solid var(--primary-blue);
      border-radius: 5px;
      background: var(--surface-white);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .custom-checkbox::after {
      content: "";
      width: 9px;
      height: 5px;
      border-left: 2px solid #ffffff;
      border-bottom: 2px solid #ffffff;
      transform: rotate(-45deg);
      opacity: 0;
      margin-top: -2px;
    }

    .keep-login input:checked + .custom-checkbox {
      background: var(--primary-blue);
    }

    .keep-login input:checked + .custom-checkbox::after {
      opacity: 1;
    }

    .keep-login-text {
      margin-left: 17px;
      color: var(--text-secondary);
      font-size: 16px;
      line-height: 24px;
      font-weight: 500;
      letter-spacing: -0.4px;
    }

    .login-button {
      width: 100%;
      min-height: 52px;
      margin-top: 18px;
      border: 0;
      border-radius: 15px;
      background: var(--primary-blue);
      color: #ffffff;
      font-size: 17px;
      line-height: 24px;
      font-weight: 700;
      cursor: pointer;
    }

    .login-button:active {
      background: #0048cc;
    }

    .password-link-wrap {
      width: 100%;
      margin-top: 22px;
      text-align: center;
    }

    .password-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      color: var(--primary-blue);
      font-size: 16px;
      line-height: 24px;
      font-weight: 700;
      text-decoration: none;
    }

    .social-title-wrap {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 26px;
      margin-top: 16px;
    }

    .social-line {
      height: 1px;
      background: var(--line-gray);
      flex: 1;
    }

    .social-title {
      color: var(--text-secondary);
      font-size: 16px;
      line-height: 24px;
      font-weight: 600;
      white-space: nowrap;
    }

    .social-list {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
      padding: 0 3px;
    }

    .social-button {
      width: 64px;
      height: 64px;
      border: 1px solid var(--border-gray);
      border-radius: 50%;
      background: var(--surface-white);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .social-button img {
      width: 36px;
      height: 36px;
      object-fit: contain;
    }

    .guest-button {
      width: 100%;
      min-height: 52px;
      margin-top: 32px;
      border: 1px solid var(--primary-navy);
      border-radius: 15px;
      background: var(--surface-white);
      color: var(--primary-navy);
      font-size: 16px;
      line-height: 24px;
      font-weight: 700;
      cursor: pointer;
    }

    .signup-wrap {
      width: 100%;
      margin-top: 10px;
      text-align: center;
    }

    .signup-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      color: var(--primary-blue);
      font-size: 16px;
      line-height: 24px;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="login-header">
      <h1 class="login-title">로그인</h1>
      <p class="login-description">이어타고로 편리하게 이동하세요.</p>
    </header>

    <form class="login-form">
      <div class="input-group">
        <img
          src="./icons/userdeactive.svg"
          alt="유저아이콘"
          class="input-icon"
        />

        <input
          type="text"
          class="input-field"
          placeholder="이메일 또는 아이디"
          aria-label="이메일 또는 아이디"
        />
      </div>

      <div class="input-group">
        <img
          src="./icons/lock.svg"
          alt="잠금아이콘"
          class="input-icon"
        />

        <input
          type="password"
          class="input-field"
          placeholder="비밀번호"
          aria-label="비밀번호"
        />

        <button
          type="button"
          class="password-toggle"
          aria-label="비밀번호 표시"
        >
          <img
            src="./icons/hidden.svg"
            alt="가리기아이콘"
          />
        </button>
      </div>

      <label class="keep-login">
        <input type="checkbox" />

        <span class="custom-checkbox"></span>

        <span class="keep-login-text">
          로그인 상태 유지 (아이디 저장)
        </span>
      </label>

      <button type="submit" class="login-button">
        로그인
      </button>
    </form>

    <div class="password-link-wrap">
      <a href="#" class="password-link">
        비밀번호 찾기
      </a>
    </div>

    <div class="social-title-wrap">
      <span class="social-line"></span>
      <p class="social-title">간편 로그인</p>
      <span class="social-line"></span>
    </div>

    <div class="social-list">
      <button type="button" class="social-button" aria-label="네이버 로그인">
        <img src="./icons/naver.svg" alt="네이버" />
      </button>

      <button type="button" class="social-button" aria-label="카카오 로그인">
        <img src="./icons/kakao.svg" alt="카카오" />
      </button>

      <button type="button" class="social-button" aria-label="구글 로그인">
        <img src="./icons/google.svg" alt="구글" />
      </button>

      <button type="button" class="social-button" aria-label="애플 로그인">
        <img src="./icons/apple.svg" alt="애플" />
      </button>
    </div>

    <button type="button" class="guest-button">
      비회원 둘러보기
    </button>

    <div class="signup-wrap">
      <a href="./signin.html" class="signup-link">
        회원가입
      </a>
    </div>
  </main>
  <script>
  const loginForm = document.querySelector(".login-form");

  loginForm.addEventListener("submit", function (event) {
    event.preventDefault();
    window.location.href = "./home.html";
  });
  </script>
</body>
</html>
