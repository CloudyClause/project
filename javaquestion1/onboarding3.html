<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>이어타고 - 온보딩 3</title>

  <style>
    :root {
      --primary-navy: #061a3d;
      --primary-blue: #005bff;
      --text-secondary: #6b7280;
      --border-gray: #d9dee6;
      --surface-white: #ffffff;
      --indicator-gray: #cfcfcf;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: var(--surface-white);
      font-family:
        "Pretendard",
        "Noto Sans KR",
        "Apple SD Gothic Neo",
        Arial,
        sans-serif;
    }

    body {
      overflow-x: hidden;
    }

    button {
      font: inherit;
    }

    .app {
      width: 100%;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      padding: 74px 24px 28px;
      background: var(--surface-white);
    }

    .onboarding-header {
      width: 100%;
      text-align: center;
    }

    .page-title {
      color: var(--primary-navy);
      font-size: 24px;
      line-height: 1.35;
      font-weight: 800;
      letter-spacing: -0.8px;
    }

    .page-description {
      margin-top: 14px;
      color: var(--text-secondary);
      font-size: 16px;
      line-height: 1.45;
      font-weight: 500;
      letter-spacing: -0.4px;
    }

    .visual-card {
      width: 100%;
      margin-top: 30px;
      overflow: hidden;
      border: 2px solid var(--border-gray);
      border-radius: 18px;
      background: var(--surface-white);
    }

    .visual-image-wrap {
      width: 100%;
      aspect-ratio: 327 / 274;
      overflow: hidden;
      background: #eef7ff;
    }

    .visual-image {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .visual-content {
      width: 100%;
      min-height: 112px;
      padding: 16px 18px 14px;
      text-align: center;
      background: var(--surface-white);
    }

    .visual-title {
      color: var(--primary-navy);
      font-size: 22px;
      line-height: 1.35;
      font-weight: 800;
      letter-spacing: -0.8px;
    }

    .visual-description {
      margin-top: 12px;
      color: var(--text-secondary);
      font-size: 15px;
      line-height: 1.45;
      font-weight: 500;
      letter-spacing: -0.35px;
    }

    .page-indicator {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 40px;
      margin-top: 32px;
    }

    .indicator-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--indicator-gray);
    }

    .indicator-dot.active {
      background: var(--primary-blue);
    }

    .onboarding-actions {
      width: 100%;
      margin-top: auto;
      padding-top: 34px;
    }

    .start-button {
      width: 100%;
      min-height: 52px;
      border: 0;
      border-radius: 16px;
      background: var(--primary-blue);
      color: #ffffff;
      font-size: 17px;
      line-height: 24px;
      font-weight: 700;
      cursor: pointer;
    }

    .start-button:active {
      background: #0048cc;
    }

    .skip-button {
      width: 100%;
      min-height: 44px;
      margin-top: 14px;
      border: 0;
      background: transparent;
      color: var(--primary-blue);
      font-size: 16px;
      line-height: 24px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="onboarding-header">
      <h1 class="page-title">구매 후 경로 안내</h1>

      <p class="page-description">
        구매한 경로를 실시간으로 안내하며<br />
        환승 정보도 알려드려요.
      </p>
    </header>

    <section class="visual-card">
      <div class="visual-image-wrap">
        <img
          class="visual-image"
          src="./images/Onboardimg3.svg"
          alt="열차와 환승 경로를 표시한 실시간 경로 안내 일러스트"
        />
      </div>

      <div class="visual-content">
        <h2 class="visual-title">실시간 경로 안내</h2>

        <p class="visual-description">
          현재 위치와 다음 환승 정보를<br />
          실시간으로 확인하세요.
        </p>
      </div>
    </section>

    <div class="page-indicator" aria-label="온보딩 진행 상태">
      <span class="indicator-dot"></span>
      <span class="indicator-dot"></span>
      <span class="indicator-dot active"></span>
    </div>

    <div class="onboarding-actions">
      <button type="button" class="start-button">시작하기</button>
      <button type="button" class="skip-button">건너뛰기</button>
    </div>
  </main>
  <script>
  const startButton = document.querySelector(".start-button");
  const skipButton = document.querySelector(".skip-button");

  const autoMoveTimer = setTimeout(function () {
    window.location.href = "./login.html";
  }, 2000);

  startButton.addEventListener("click", function () {
    clearTimeout(autoMoveTimer);
    window.location.href = "./login.html";
  });

  skipButton.addEventListener("click", function () {
    clearTimeout(autoMoveTimer);
    window.location.href = "./login.html";
  });
  </script>
</body>
</html>
