<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>설화수 추천 슬라이드</title>

  <!-- Swiper CSS -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
  >

  <!-- 사용자 CSS -->
  <link rel="stylesheet" href="./css/style.css">
</head>

<body>

  <!-- ========================================
       설화수 추천 Banner Slide Section
  ======================================== -->
  <section class="recommend-section">

    <div class="recommend-inner">

      <!-- 섹션 제목 -->
      <h2 class="recommend-title">설화수 추천</h2>


      <!-- ========================================
           Swiper 영역
      ======================================== -->
      <div class="recommend-slider-wrap">

        <div class="swiper recommend-swiper">

          <div class="swiper-wrapper">


            <!-- 슬라이드 01 -->
            <div class="swiper-slide">

              <div class="product-card">

                <!--
                  실제 사용할 이미지로 교체해주세요.
                  예:
                  ../images/product01.jpg
                -->
                <div class="product-image">
                  <img
                    src="./images/banner1.jpg"
                    alt="탄력크림 EX"
                  >
                </div>

                <div class="product-info">

                  <h3>탄력크림 EX</h3>

                  <p class="product-en">
                    Essential Firming Cream EX
                  </p>

                  <p class="product-price">
                    100,000원
                  </p>

                </div>

              </div>

            </div>


            <!-- 슬라이드 02 -->
            <div class="swiper-slide">

              <div class="product-card">

                <div class="product-image">
                  <img
                    src="./images/banner2.jpg"
                    alt="자정기미코렉터"
                  >
                </div>

                <div class="product-info">

                  <h3>자정기미코렉터</h3>

                  <p class="product-en">
                    Lumivise Discoloration Corrector
                  </p>

                  <p class="product-price">
                    150,000원
                  </p>

                </div>

              </div>

            </div>


            <!-- 슬라이드 03 -->
            <div class="swiper-slide">

              <div class="product-card">

                <div class="product-image">
                  <img
                    src="./images/banner3.jpg"
                    alt="퍼펙팅 쿠션 에어리"
                  >
                </div>

                <div class="product-info">

                  <h3>퍼펙팅 쿠션 에어리</h3>

                  <p class="product-en">
                    Perfecting Cushion Airy
                  </p>

                  <p class="product-price">
                    89,000원
                  </p>

                </div>

              </div>

            </div>


            <!-- 슬라이드 04 -->
            <div class="swiper-slide">

              <div class="product-card">

                <div class="product-image">
                  <img
                    src="./images/banner4.jpg"
                    alt="윤조아이세럼"
                  >
                </div>

                <div class="product-info">

                  <h3>윤조아이세럼</h3>

                  <p class="product-en">
                    First Care Activating Eye Serum
                  </p>

                  <p class="product-price">
                    115,000원
                  </p>

                </div>

              </div>

            </div>


            <!-- 슬라이드 05 -->
            <div class="swiper-slide">

              <div class="product-card">

                <div class="product-image">
                  <img
                    src="./images/banner5.jpg"
                    alt="여윤팩"
                  >
                </div>

                <div class="product-info">

                  <h3>여윤팩</h3>

                  <p class="product-en">
                    Overnight Recharging Mask
                  </p>

                  <p class="product-price">
                    70,000원
                  </p>

                </div>

              </div>

            </div>


            <!-- 슬라이드 06 -->
            <div class="swiper-slide">

              <div class="product-card">

                <div class="product-image">
                  <img
                    src="./images/banner6.jpg"
                    alt="순행클렌징폼"
                  >
                </div>

                <div class="product-info">

                  <h3>순행클렌징폼</h3>

                  <p class="product-en">
                    Gentle Cleansing Foam
                  </p>

                  <p class="product-price">
                    67,000원
                  </p>

                </div>

              </div>

            </div>


          </div>
          <!-- // swiper-wrapper -->

        </div>
        <!-- // recommend-swiper -->


        <!-- ========================================
             이전 버튼
        ======================================== -->
        <button
          type="button"
          class="recommend-arrow recommend-prev"
          aria-label="이전 슬라이드"
        >
          <!-- 원하는 버튼 이미지로 교체 -->
          <img
            src="./images/left.png"
            alt=""
          >
        </button>


        <!-- ========================================
             다음 버튼
        ======================================== -->
        <button
          type="button"
          class="recommend-arrow recommend-next"
          aria-label="다음 슬라이드"
        >
          <!-- 원하는 버튼 이미지로 교체 -->
          <img
            src="./images/right.png"
            alt=""
          >
        </button>

      </div>
      <!-- // recommend-slider-wrap -->


      <!-- ========================================
           하단 진행 상태 영역
      ======================================== -->
      <div class="slide-control">

        <!-- 진행 상태 막대 -->
        <div class="progress-bar">

          <span class="progress-fill"></span>

        </div>


        <!-- 재생 / 일시정지 버튼 -->
        <button
          type="button"
          class="play-control pause"
          aria-label="슬라이드 일시정지"
        >

          <!-- 일시정지 이미지 -->
          <img
            class="pause-icon"
            src="./images/pause.svg"
            alt=""
          >

          <!-- 재생 이미지 -->
          <img
            class="play-icon"
            src="./images/play.svg"
            alt=""
          >

        </button>

      </div>
      <!-- // slide-control -->

    </div>
    <!-- // recommend-inner -->

  </section>
  <!-- // recommend-section -->


  <!-- Swiper JS -->
  <script
    src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js">
  </script>

  <!-- 사용자 JS -->
  <script src="./js/script.js"></script>

</body>
</html>
