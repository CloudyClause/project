<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <h1>[position명령 익히기]</h1>
    <p>position은 공중에 띄워서 요소를 배치하는 명령</p>
    <ol>
        <li>static -> 공중에 띄운 요소 해제(취소)</li>
        <li>relative -> 상대저인 기준을 설정</li>
        <li>absolute -> 공중에 띄워서 원하는 위치에 배치(웹브라우저기준)</li>
        <li>fixed -> 공중에 띄워서 고정으로 배치</li>
        <li>배치할때 사용하는 명령 left,top,right,bottom</li>
        <li>z-index -> 공중에 띄운 요소끼리 레이어 순서 바꿀때</li>
    </ol>
    <hr>
    <div class="box1">box1</div>
    <div class="box2">
        <div class="child1">child1</div>
        <div class="child2">child2</div>
    </div>
    <div class="box3">box3</div>
    <div class="box4">box4</div>
    <div class="ai">
        <img src="./images/RubiconLogo.gif" alt="">
    </div>

</body>
</html>
