<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>폼응용3</title>
    <link rel="stylesheet" href="./css/form4.css">
</head>
<body>
    <form action="">
        <fieldset>
            <legend>신청과목</legend>
            <ul>
                <li>
                    이 달에 신청할 과목을 선택하세요 (1과목만 가능)
                </li>
                <li>
                    <input type="radio" name="subject" checked>
                    <label for="">회화</label>
                    <input type="radio" name="subject">
                    <label for="">문법</label>
                    <input type="radio" name="subject">
                    <label for="">작문</label>
                </li>
            </ul>
        </fieldset>
        <fieldset>
            <legend>메일링</legend>
            <ul>
                <li>
                    메일로 받고 싶은 뉴스 주제를 선택해 주세요(복수선택가능)
                </li>
                <li>
                    <input type="checkbox" checked>
                    <label for="">해외단신</label>
                    <input type="checkbox" checked>
                    <label for="">5분 회화</label>
                    <input type="checkbox" checked>
                    <label for="">모닝팝스</label>
                </li>
            </ul>
        </fieldset>

    </form>

    
</body>
</html>
