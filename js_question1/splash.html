<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>이어타고 Splash</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: "Pretendard", "Noto Sans KR", Arial, sans-serif;
      background: #f3f3f3;
    }

    body {
      overflow: hidden;
    }

    .app {
      width: 100%;
      min-height: 100svh;
      background: #f3f3f3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 72px 24px 56px;
    }

    .top-area {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .logo-mark {
      width: 144px;
      display: block;
      margin-bottom: 22px;
    }

    .brand-title {
      font-size: 64px;
      line-height: 1;
      font-weight: 800;
      color: #061a3d;
      letter-spacing: -2px;
      margin-bottom: 18px;
    }

    .brand-subtitle {
      font-size: 24px;
      line-height: 1.4;
      font-weight: 500;
      color: #333333;
      letter-spacing: -0.4px;
    }

    .visual-area {
      width: calc(100% + 48px);
      display: flex;
      justify-content: center;
      margin-top: 8px;
      margin-bottom: 28px;
    }

    .splash-visual {
      width: 100%;
      display: block;
    }

    .bottom-area {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .progress-track {
      width: 88%;
      height: 14px;
      background: #d9d9de;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      width: 0;
      transition: width 3s linear;
      height: 100%;
      background: #005bff;
      border-radius: 999px;
    }

    .loading-text {
      font-size: 23px;
      line-height: 1;
      font-weight: 500;
      color: #767676;
      letter-spacing: -0.4px;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="top-area">
      <img src="./images/Logo.svg" alt="이어타고 로고" class="logo-mark" />

      <h1 class="brand-title">이어타고</h1>
      <p class="brand-subtitle">전철을 이어, 목적지로 타고</p>
    </div>

    <div class="visual-area">
      <img src="./images/splashimg.svg" alt="열차와 도시 배경 일러스트" class="splash-visual" />
    </div>

    <div class="bottom-area">
      <div class="progress-track">
        <div class="progress-fill"></div>
      </div>
      <p class="loading-text">로딩 중...</p>
    </div>
  </div>
  <script>
  const progressFill = document.querySelector(".progress-fill");

  window.addEventListener("DOMContentLoaded", function () {
    /*
      브라우저가 width: 0 상태를 먼저 화면에 표시한 다음
      100%까지 3초 동안 차오르도록 실행합니다.
    */
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        progressFill.style.width = "100%";
      });
    });

    /*
      로딩바가 모두 차오르는 3초 후
      온보딩 첫 번째 화면으로 이동합니다.
    */
    setTimeout(function () {
        window.location.href = "./onboarding1.html";
    }, 3000);
  });
</script>
</body>
</html>
