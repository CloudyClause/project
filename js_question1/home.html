<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>이어타고 - 홈</title>

  <style>
    :root {
      --primary-navy: #061a3d;
      --primary-blue: #005bff;
      --text-primary: #111827;
      --text-secondary: #6b7280;
      --border-gray: #697386;
      --light-border: #e5e7eb;
      --surface-white: #ffffff;
      --danger: #ef4444;

      --space-8: 8px;
      --space-12: 12px;
      --space-16: 16px;
      --space-20: 20px;
      --space-24: 24px;

      --radius-card: 12px;
      --tabbar-height: 94px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: var(--surface-white);
      font-family:
        "Pretendard",
        "Noto Sans KR",
        "Apple SD Gothic Neo",
        Arial,
        sans-serif;
    }

    body {
      overflow-x: hidden;
    }

    button,
    input,
    a {
      font: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: 100%;
      min-height: 100svh;
      padding: 58px 23px calc(var(--tabbar-height) + 28px);
      background: var(--surface-white);
    }

    /* 상단 영역 */
    .home-header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .location-button {
      min-height: 44px;
      border: 0;
      background: transparent;
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--primary-navy);
      font-size: 24px;
      line-height: 32px;
      font-weight: 800;
    }

    .location-arrow {
      width: 0;
      height: 0;
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-top: 13px solid var(--primary-navy);
    }

    .notification-button {
      position: relative;
      width: 44px;
      height: 44px;
      border: 0;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    .notification-button img {
      width: 25px;
      height: 25px;
      object-fit: contain;
    }

    .notification-dot {
      position: absolute;
      top: 5px;
      right: 0;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--danger);
    }

    /* 검색창 */
    .search-form {
      position: relative;
      width: 100%;
      height: 56px;
      margin-top: 11px;
    }

    .search-input {
      width: 100%;
      height: 100%;
      padding: 0 54px 0 15px;
      border: 1px solid var(--border-gray);
      border-radius: 9px;
      background: var(--surface-white);
      color: var(--text-primary);
      font-size: 16px;
      line-height: 24px;
      outline: none;
    }

    .search-input::placeholder {
      color: var(--text-secondary);
      opacity: 1;
    }

    .search-input:focus {
      border: 2px solid var(--primary-blue);
    }

    .search-button {
      position: absolute;
      top: 50%;
      right: 8px;
      width: 44px;
      height: 44px;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .search-button img {
      width: 24px;
      height: 24px;
      object-fit: contain;
    }

    /* 공통 섹션 */
    .home-section {
      width: 100%;
      margin-top: 16px;
    }

    .section-header {
      width: 100%;
      min-height: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .section-title {
      color: var(--text-primary);
      font-size: 17px;
      line-height: 24px;
      font-weight: 800;
      letter-spacing: -0.4px;
    }

    .section-action {
      min-height: 44px;
      margin: -8px 0;
      border: 0;
      background: transparent;
      color: var(--text-secondary);
      font-size: 14px;
      line-height: 20px;
      font-weight: 500;
    }

    /* 최근 검색 */
    .recent-list {
      width: 100%;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 8px;
    }

    .recent-chip {
      min-width: 0;
      flex: 1;
      height: 38px;
      padding: 0 10px;
      border: 1px solid var(--border-gray);
      border-radius: 12px;
      background: var(--surface-white);
      color: var(--text-secondary);
      font-size: 13px;
      line-height: 18px;
      font-weight: 500;
      white-space: nowrap;
    }

    /* 빠른 메뉴 */
    .quick-menu-list {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
      margin-top: 14px;
    }

    .quick-menu-card {
      min-width: 0;
      height: 109px;
      padding: 14px 6px 10px;
      border: 1px solid var(--border-gray);
      border-radius: 8px;
      background: var(--surface-white);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      color: var(--text-primary);
    }

    .quick-menu-card img {
      width: 43px;
      height: 43px;
      object-fit: contain;
    }

    .quick-menu-label {
      font-size: 16px;
      line-height: 22px;
      font-weight: 600;
      letter-spacing: -0.4px;
    }

    /* 추천 경로 */
    .route-card {
      width: calc(100% - 10px);
      min-height: 90px;
      margin: 12px auto 0;
      padding: 15px 14px;
      border: 1px solid var(--border-gray);
      border-radius: 12px;
      background: var(--surface-white);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .route-info {
      min-width: 0;
    }

    .route-name {
      color: var(--primary-navy);
      font-size: 17px;
      line-height: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .route-description {
      margin-top: 10px;
      color: var(--text-primary);
      font-size: 13px;
      line-height: 18px;
      font-weight: 500;
    }

    .route-summary {
      flex-shrink: 0;
      margin-left: 12px;
      text-align: right;
      color: #000000;
    }

    .route-time,
    .route-price {
      font-size: 25px;
      line-height: 29px;
      font-weight: 900;
      letter-spacing: -0.8px;
    }

    /* 바로가기 */
    .shortcut-list {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      margin-top: 14px;
    }

    .shortcut-card {
      min-width: 0;
      height: 71px;
      padding: 0 14px;
      border: 1px solid var(--border-gray);
      border-radius: 8px;
      background: var(--surface-white);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      color: var(--text-primary);
    }

    .shortcut-card img {
      width: 41px;
      height: 41px;
      object-fit: contain;
    }

    .shortcut-card span {
      font-size: 15px;
      line-height: 22px;
      font-weight: 600;
      white-space: nowrap;
    }

    /* 공통 하단 탭바 */
    .bottom-tabbar {
      position: fixed;
      left: 0;
      bottom: 0;
      z-index: 100;
      width: 100%;
      height: var(--tabbar-height);
      padding: 12px 14px 13px;
      border-top: 1px solid var(--border-gray);
      background: var(--surface-white);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
    }

    .tab-item {
      min-width: 0;
      min-height: 60px;
      border: 0;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 7px;
      color: var(--text-secondary);
      text-decoration: none;
    }

    .tab-item img {
      width: 24px;
      height: 24px;
      object-fit: contain;
    }

    .tab-label {
      font-size: 11px;
      line-height: 14px;
      font-weight: 500;
    }

    .tab-item.active {
      color: var(--primary-blue);
    }

    .tab-item.active .tab-label {
      font-weight: 700;
    }
    a{text-decoration: none;}
    a:hover{text-decoration:underline ;}
  </style>
</head>

<body>
  <main class="app">
    <header class="home-header">
      <button type="button" class="location-button">
        <span>서울역</span>
        <span class="location-arrow"></span>
      </button>

      <button
        type="button"
        class="notification-button"
        aria-label="알림 확인"
      >
        <img src="./icons/belldeactive.svg" alt="알림아이콘" />
        <span class="notification-dot"></span>
      </button>
    </header>

    <form class="search-form">
      <input
        type="search"
        class="search-input"
        placeholder="어디로 이동하시나요?"
        aria-label="목적지 검색"
      />

      <button
        type="submit"
        class="search-button"
        aria-label="검색"
      >
        <img src="./icons/search.svg" alt="검색아이콘" />
      </button>
    </form>

    <section class="home-section">
      <div class="section-header">
        <h2 class="section-title">최근 검색</h2>

        <button type="button" class="section-action">
          전체 삭제
        </button>
      </div>

      <div class="recent-list">
        <button type="button" class="recent-chip">강남역</button>
        <button type="button" class="recent-chip">홍대입구역</button>
        <button type="button" class="recent-chip">잠실역</button>
        <button type="button" class="recent-chip">부산역</button>
      </div>
    </section>

    <section class="home-section">
      <h2 class="section-title">빠른 메뉴</h2>

      <div class="quick-menu-list">
        <button
          type="button"
          class="quick-menu-card prepare-menu-button"
        >
          <img
            src="./icons/document.svg"
            alt="발급준비"
          />
          <span class="quick-menu-label">발급 준비</span>
        </button>

        <button
          type="button"
          class="quick-menu-card ticket-detail-menu-button"
        >
          <img
            src="./icons/qrcode.svg"
            alt="티켓상세"
          />
          <span class="quick-menu-label">티켓 상세</span>
        </button>

        <button
          type="button"
          class="quick-menu-card route-guide-menu-button"
        >
          <img
            src="./icons/routedeactive.svg"
            alt="경로안내"
          />
          <span class="quick-menu-label">경로 안내</span>
        </button>
      </div>
    </section>

    <section class="home-section">
      <h2 class="section-title">추천 경로</h2>

      <button type="button" class="route-card">
        <span class="route-info">
          <span class="route-name">서울역 → 강남역</span>
          <span class="route-description">
            2호선 이용 · 환승 1회
          </span>
        </span>

        <span class="route-summary">
          <span class="route-time">34분</span><br />
          <span class="route-price">2,150원</span>
        </span>
      </button>
    </section>

    <section class="home-section">
      <h2 class="section-title">바로가기</h2>

      <div class="shortcut-list">
        <button type="button" class="shortcut-card">
          <img
            src="./icons/star.svg"
            alt="즐겨찾기"
          />
          <span>즐겨찾기</span>
        </button>

        <button type="button" class="shortcut-card">
          <img
            src="./icons/clock.svg"
            alt="이용 내역"
          />
          <span>이용 내역</span>
        </button>
      </div>
    </section>
  </main>

  <!-- 모든 주요 화면에서 재사용하는 공통 하단 탭바 -->
  <nav class="bottom-tabbar" aria-label="주요 메뉴">
    <a href="./home.html" class="tab-item active">
      <img src="./icons/homeactive.svg" alt="홈화면" />
      <span class="tab-label">홈</span>
    </a>

    <a href="./prepare.html" class="tab-item">
      <img src="./icons/ticketdeactive.svg" alt="발급준비" />
      <span class="tab-label">발급준비</span>
    </a>

    <a href="./route.html" class="tab-item">
      <img src="./icons/routedeactive.svg" alt="경로안내" />
      <span class="tab-label">경로안내</span>
    </a>

    <a href="./myinfo.html" class="tab-item">
      <img src="./icons/userdeactive.svg" alt="내 정보" />
      <span class="tab-label">내 정보</span>
    </a>
  </nav>
<script>
    const homeSearchButton = document.querySelector(".search-button");
    const prepareMenuButton = document.querySelector(
      ".prepare-menu-button"
    );
    const ticketDetailMenuButton = document.querySelector(
      ".ticket-detail-menu-button"
    );
    const routeGuideMenuButton = document.querySelector(
      ".route-guide-menu-button"
    );

    homeSearchButton.addEventListener("click", function (event) {
      event.preventDefault();
      window.location.href = "./search.html";
    });

    prepareMenuButton.addEventListener("click", function () {
      window.location.href = "./prepare.html";
    });

    ticketDetailMenuButton.addEventListener("click", function () {
      window.location.href = "./detail.html";
    });

    routeGuideMenuButton.addEventListener("click", function () {
      window.location.href = "./route.html";
    });
  </script>
</body>
</html>
