<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>이어타고 - 발급 완료</title>

  <style>
    :root {
      --primary-navy: #061a3d;
      --primary-blue: #005bff;
      --light-blue: #eaf3ff;
      --text-primary: #111827;
      --text-secondary: #6b7280;
      --border-gray: #687386;
      --surface-white: #ffffff;

      --radius-card: 14px;
      --tabbar-height: 94px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: var(--surface-white);
      font-family:
        "Pretendard",
        "Noto Sans KR",
        "Apple SD Gothic Neo",
        Arial,
        sans-serif;
    }

    body {
      overflow-x: hidden;
    }

    button,
    a {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: 100%;
      min-height: 100svh;
      padding: 53px 24px calc(var(--tabbar-height) + 16px);
      background: var(--surface-white);
    }

    /* 발급 완료 안내 */
    .complete-header {
      width: 100%;
      text-align: center;
    }

    .complete-icon {
      width: 55px;
      height: 55px;
      display: block;
      margin: 0 auto;
    }

    .complete-title {
      margin-top: 16px;
      color: #000000;
      font-size: 24px;
      line-height: 32px;
      font-weight: 800;
      letter-spacing: -0.8px;
    }

    .complete-description {
      margin-top: 3px;
      color: #000000;
      font-size: 16px;
      line-height: 24px;
      font-weight: 500;
      letter-spacing: -0.35px;
    }

    /* 공통 정보 카드 */
    .info-card {
      width: 100%;
      margin-top: 16px;
      padding: 13px 13px 14px;
      border: 1px solid var(--border-gray);
      border-radius: var(--radius-card);
      background: var(--surface-white);
    }

    .card-title {
      color: var(--primary-navy);
      font-size: 23px;
      line-height: 30px;
      font-weight: 800;
      letter-spacing: -0.7px;
    }

    .info-list {
      margin-top: 5px;
    }

    .info-row {
      width: 100%;
      min-height: 29px;
      display: grid;
      grid-template-columns: 128px 1fr;
      align-items: center;
    }

    .info-label {
      color: var(--primary-navy);
      font-size: 17px;
      line-height: 24px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .info-value {
      color: var(--text-secondary);
      font-size: 17px;
      line-height: 24px;
      font-weight: 600;
      letter-spacing: -0.35px;
    }

    /* 결제 정보 카드 */
    .payment-card {
      margin-top: 8px;
    }

    /* 티켓 안내 */
    .ticket-notice {
      width: 100%;
      min-height: 67px;
      margin-top: 8px;
      padding: 11px 14px;
      border: 1px solid #d6e3f4;
      border-radius: 12px;
      background: var(--light-blue);
      display: flex;
      align-items: center;
    }

    .ticket-notice-icon {
      width: 39px;
      height: 39px;
      flex-shrink: 0;
      object-fit: contain;
    }

    .ticket-notice-text {
      margin-left: 13px;
      color: var(--text-secondary);
      font-size: 15px;
      line-height: 21px;
      font-weight: 500;
      letter-spacing: -0.3px;
    }

    /* 하단 버튼 */
    .action-buttons {
      width: 100%;
      margin-top: 17px;
    }

    .primary-button,
    .secondary-button {
      width: 100%;
      min-height: 52px;
      border-radius: 15px;
      font-size: 17px;
      line-height: 24px;
      font-weight: 700;
    }

    .primary-button {
      border: 0;
      background: var(--primary-blue);
      color: #ffffff;
    }

    .primary-button:active {
      background: #0048cc;
    }

    .secondary-button {
      margin-top: 8px;
      border: 1px solid var(--primary-blue);
      background: var(--surface-white);
      color: var(--primary-blue);
    }

    .secondary-button:active {
      background: var(--light-blue);
    }

    /* 공통 하단 탭바 */
    .bottom-tabbar {
      position: fixed;
      left: 0;
      bottom: 0;
      z-index: 100;
      width: 100%;
      height: var(--tabbar-height);
      padding: 12px 14px 13px;
      border-top: 1px solid var(--border-gray);
      background: var(--surface-white);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
    }

    .tab-item {
      min-width: 0;
      min-height: 60px;
      border: 0;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 7px;
      color: var(--text-secondary);
      text-decoration: none;
    }

    .tab-item img {
      width: 24px;
      height: 24px;
      object-fit: contain;
    }

    .tab-label {
      font-size: 11px;
      line-height: 14px;
      font-weight: 500;
    }

    .tab-item.active {
      color: var(--primary-blue);
    }

    .tab-item.active .tab-label {
      font-weight: 700;
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="complete-header">
      <img
        src="./icons/checkcircle.svg"
        alt="발권 완료"
        class="complete-icon"
      />

      <h1 class="complete-title">발권이 완료되었습니다</h1>

      <p class="complete-description">
        이용해주셔서 감사합니다.
      </p>
    </header>

    <section class="info-card">
      <h2 class="card-title">티켓 정보</h2>

      <div class="info-list">
        <div class="info-row">
          <span class="info-label">출발</span>
          <span class="info-value">서울역</span>
        </div>

        <div class="info-row">
          <span class="info-label">도착</span>
          <span class="info-value">강남역</span>
        </div>

        <div class="info-row">
          <span class="info-label">이용일</span>
          <span class="info-value">2024.05.24 (금)</span>
        </div>

        <div class="info-row">
          <span class="info-label">성인</span>
          <span class="info-value">1명</span>
        </div>
      </div>
    </section>

    <section class="info-card payment-card">
      <h2 class="card-title">결제 정보</h2>

      <div class="info-list">
        <div class="info-row">
          <span class="info-label">결제수단</span>
          <span class="info-value">신용/체크카드</span>
        </div>

        <div class="info-row">
          <span class="info-label">결제금액</span>
          <span class="info-value">2,150원</span>
        </div>
      </div>
    </section>

    <div class="ticket-notice">
      <img
        src="./icons/qrcode.svg"
        alt="주의사항"
        class="ticket-notice-icon"
      />

      <p class="ticket-notice-text">
        모바일 티켓은 유효기간 내에<br />
        사용해주세요.
      </p>
    </div>

    <div class="action-buttons">
      <button type="button" class="primary-button">
        티켓 상세 보기
      </button>

      <button type="button" class="secondary-button">
        경로 안내 보기
      </button>
    </div>
  </main>

  <!-- 공통 하단 탭바 -->
  <nav class="bottom-tabbar" aria-label="주요 메뉴">
    <a href="./home.html" class="tab-item">
      <img src="./icons/homedeactive.svg" alt="홈 화면" />
      <span class="tab-label">홈</span>
    </a>

    <a href="./prepare.html" class="tab-item active">
      <img src="./icons/ticketactive.svg" alt="발급준비" />
      <span class="tab-label">발급준비</span>
    </a>

    <a href="./route.html" class="tab-item">
      <img src="./icons/routedeactive.svg" alt="경로안내" />
      <span class="tab-label">경로안내</span>
    </a>

    <a href="./myinfo.html" class="tab-item">
      <img src="./icons/userdeactive.svg" alt="내 정보" />
      <span class="tab-label">내 정보</span>
    </a>
  </nav>
  <script>
  const ticketDetailButton = document.querySelector(".primary-button");
  const routeGuideButton = document.querySelector(".secondary-button");

  ticketDetailButton.addEventListener("click", function () {
    window.location.href = "./detail.html";
  });

  routeGuideButton.addEventListener("click", function () {
    window.location.href = "./route.html";
  });
  </script>
</body>
</html>
