<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>이어타고 - 발급 준비</title>

  <style>
    :root {
      --primary-navy: #061a3d;
      --primary-blue: #005bff;
      --transit-blue: #2f80ed;
      --light-blue: #eaf3ff;
      --success: #16a34a;
      --text-primary: #111827;
      --text-secondary: #6b7280;
      --border-gray: #687386;
      --surface-white: #ffffff;

      --radius-card: 16px;
      --tabbar-height: 94px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: var(--surface-white);
      font-family:
        "Pretendard",
        "Noto Sans KR",
        "Apple SD Gothic Neo",
        Arial,
        sans-serif;
    }

    body {
      overflow-x: hidden;
    }

    button,
    a {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: 100%;
      min-height: 100svh;
      padding: 58px 24px calc(var(--tabbar-height) + 20px);
      background: var(--surface-white);
    }

    /* 상단 제목 영역 */
    .page-header {
      position: relative;
      width: 100%;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .back-button {
      position: absolute;
      top: 0;
      left: -8px;
      width: 44px;
      height: 44px;
      border: 0;
      background: transparent;
    }

    .back-button::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 10px;
      width: 18px;
      height: 18px;
      border-left: 2px solid var(--primary-navy);
      border-bottom: 2px solid var(--primary-navy);
      transform: translateY(-50%) rotate(45deg);
    }

    .back-button::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 10px;
      width: 27px;
      height: 2px;
      background: var(--primary-navy);
      transform: translateY(-50%);
    }

    .page-title {
      color: var(--primary-navy);
      font-size: 24px;
      line-height: 32px;
      font-weight: 800;
      letter-spacing: -0.8px;
    }

    /* 출발·도착 카드 */
    .route-card {
      width: 100%;
      margin-top: 19px;
      padding: 17px 15px 15px;
      border: 1px solid var(--border-gray);
      border-radius: var(--radius-card);
      background: var(--surface-white);
    }

    .route-main {
      display: grid;
      grid-template-columns: 1fr 48px 1fr;
      align-items: center;
    }

    .station-column {
      min-width: 0;
    }

    .station-column.destination {
      text-align: right;
    }

    .station-label {
      color: var(--text-secondary);
      font-size: 15px;
      line-height: 22px;
      font-weight: 500;
    }

    .station-name {
      display: block;
      margin-top: 10px;
      color: var(--primary-navy);
      font-size: 23px;
      line-height: 30px;
      font-weight: 800;
      letter-spacing: -0.8px;
    }

    .route-arrow {
      position: relative;
      width: 48px;
      height: 40px;
    }

    .route-arrow::before {
      content: "";
      position: absolute;
      top: 19px;
      left: 7px;
      width: 28px;
      height: 2px;
      background: var(--primary-blue);
    }

    .route-arrow::after {
      content: "";
      position: absolute;
      top: 12px;
      right: 8px;
      width: 13px;
      height: 13px;
      border-top: 2px solid var(--primary-blue);
      border-right: 2px solid var(--primary-blue);
      transform: rotate(45deg);
    }

    .route-meta {
      display: flex;
      justify-content: space-between;
      margin-top: 12px;
    }

    .transfer-info {
      color: var(--success);
      font-size: 15px;
      line-height: 22px;
      font-weight: 700;
    }

    .duration-info {
      color: var(--primary-blue);
      font-size: 15px;
      line-height: 22px;
      font-weight: 700;
    }

    /* 발급 정보 목록 */
    .option-card {
      width: 100%;
      margin-top: 21px;
      padding: 0 4px;
      border: 1px solid var(--border-gray);
      border-radius: var(--radius-card);
      background: var(--surface-white);
      overflow: hidden;
    }

    .option-item {
      width: 100%;
      min-height: 56px;
      padding: 0 12px 0 7px;
      border: 0;
      border-bottom: 1px solid var(--border-gray);
      background: transparent;
      display: flex;
      align-items: center;
      text-align: left;
    }

    .option-item:last-child {
      border-bottom: 0;
    }

    .option-icon {
      width: 26px;
      height: 26px;
      flex-shrink: 0;
      object-fit: contain;
    }

    .option-label {
      margin-left: 10px;
      color: var(--text-secondary);
      font-size: 16px;
      line-height: 24px;
      font-weight: 500;
    }

    .option-value {
      margin-left: auto;
      color: var(--text-secondary);
      font-size: 16px;
      line-height: 24px;
      font-weight: 500;
      text-align: right;
    }

    .option-chevron {
      position: relative;
      width: 20px;
      height: 44px;
      margin-left: 7px;
      flex-shrink: 0;
    }

    .option-chevron::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 4px;
      width: 9px;
      height: 9px;
      border-top: 2px solid var(--text-secondary);
      border-right: 2px solid var(--text-secondary);
      transform: translateY(-50%) rotate(45deg);
    }

    /* 안내 상자 */
    .notice-box {
      width: 100%;
      min-height: 86px;
      margin-top: 31px;
      padding: 18px 15px;
      border: 1px solid #d8e4f4;
      border-radius: var(--radius-card);
      background: var(--light-blue);
      display: flex;
      align-items: center;
    }

    .notice-icon {
      width: 23px;
      height: 23px;
      flex-shrink: 0;
      object-fit: contain;
    }

    .notice-text {
      margin-left: 16px;
      color: var(--text-secondary);
      font-size: 15px;
      line-height: 21px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    /* 결제 버튼 */
    .payment-button {
      width: 100%;
      min-height: 52px;
      margin-top: 31px;
      border: 0;
      border-radius: 15px;
      background: var(--primary-blue);
      color: #ffffff;
      font-size: 17px;
      line-height: 24px;
      font-weight: 700;
    }

    .payment-button:active {
      background: #0048cc;
    }

    /* 공통 하단 탭바 */
    .bottom-tabbar {
      position: fixed;
      left: 0;
      bottom: 0;
      z-index: 100;
      width: 100%;
      height: var(--tabbar-height);
      padding: 12px 14px 13px;
      border-top: 1px solid var(--border-gray);
      background: var(--surface-white);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
    }

    .tab-item {
      min-width: 0;
      min-height: 60px;
      border: 0;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 7px;
      color: var(--text-secondary);
      text-decoration: none;
    }

    .tab-item img {
      width: 24px;
      height: 24px;
      object-fit: contain;
    }

    .tab-label {
      font-size: 11px;
      line-height: 14px;
      font-weight: 500;
    }

    .tab-item.active {
      color: var(--primary-blue);
    }

    .tab-item.active .tab-label {
      font-weight: 700;
    }

  </style>
</head>

<body>
  <main class="app">
    <header class="page-header">
      <button
        type="button"
        class="back-button"
        aria-label="이전 화면으로 이동"
      ></button>

      <h1 class="page-title">발급 준비</h1>
    </header>

    <section class="route-card">
      <div class="route-main">
        <div class="station-column">
          <span class="station-label">출발</span>
          <strong class="station-name">서울역</strong>
        </div>

        <span class="route-arrow" aria-hidden="true"></span>

        <div class="station-column destination">
          <span class="station-label">도착</span>
          <strong class="station-name">강남역</strong>
        </div>
      </div>

      <div class="route-meta">
        <span class="transfer-info">2호선 환승 1회</span>
        <span class="duration-info">예상 34분</span>
      </div>
    </section>

    <section class="option-card">
      <button type="button" class="option-item">
        <img
          src="./icons/clock.svg"
          alt="이용 일시"
          class="option-icon"
        />
        <span class="option-label">이용 일시</span>
        <span class="option-value">2025.05.20 (화) 14:30</span>
        <span class="option-chevron"></span>
      </button>

      <button type="button" class="option-item">
        <img
          src="./icons/userdeactive.svg"
          alt="탑승 인원"
          class="option-icon"
        />
        <span class="option-label">탑승 인원</span>
        <span class="option-value">성인 1명</span>
        <span class="option-chevron"></span>
      </button>

      <button type="button" class="option-item">
        <img
          src="./icons/ticketdeactive.svg"
          alt="티켓 종류"
          class="option-icon"
        />
        <span class="option-label">티켓 종류</span>
        <span class="option-value">일반 티켓</span>
        <span class="option-chevron"></span>
      </button>

      <button type="button" class="option-item">
        <img
          src="./icons/dollar.svg"
          alt="예상 요금"
          class="option-icon"
        />
        <span class="option-label">예상 요금</span>
        <span class="option-value">2,150원</span>
        <span class="option-chevron"></span>
      </button>
    </section>

    <div class="notice-box">
      <img
        src="./icons/infoactive.svg"
        alt="정보아이콘"
        class="notice-icon"
      />

      <p class="notice-text">
        실제 요금은 경로 및 환승 조건에 따라<br />
        달라질 수 있습니다.
      </p>
    </div>

    <button type="button" class="payment-button">
      결제 진행
    </button>
  </main>

  <!-- 공통 하단 탭바 -->
  <nav class="bottom-tabbar" aria-label="주요 메뉴">
    <a href="./home.html" class="tab-item">
      <img src="./icons/homedeactive.svg" alt="홈 화면" />
      <span class="tab-label">홈</span>
    </a>

    <a href="./prepare.html" class="tab-item active">
      <img src="./icons/ticketactive.svg" alt="발급준비" />
      <span class="tab-label">발급준비</span>
    </a>

    <a href="./route.html" class="tab-item">
      <img src="./icons/routedeactive.svg" alt="경로안내" />
      <span class="tab-label">경로안내</span>
    </a>

    <a href="./myinfo.html" class="tab-item">
      <img src="./icons/userdeactive.svg" alt="내 정보" />
      <span class="tab-label">내 정보</span>
    </a>
  </nav>
    <script>
    const backButton = document.querySelector(".back-button");
    const paymentButton = document.querySelector(".payment-button");

    backButton.addEventListener("click", function () {
        window.history.back();
    });

    paymentButton.addEventListener("click", function () {
        window.location.href = "./finalcheck.html";
    });
    </script>
</body>
</html>
