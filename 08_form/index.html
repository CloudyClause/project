<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Classic Blue Tetris</title>

  <link rel="stylesheet" href="./css/main.css">
</head>

<body>

  <main class="tetris-machine">

    <!-- ========================================
         테트리스 전체 프레임
    ========================================= -->
    <div class="machine-frame">

      <!-- ==============================
           왼쪽 : 실제 게임판
      =============================== -->
      <section class="play-area">

        <div class="board-frame">

          <canvas
            id="tetris"
            width="300"
            height="600"
          ></canvas>

          <!-- 게임 종료 / 일시정지 -->
          <div
            class="game-overlay"
            id="gameOverlay"
          >
            <h2 id="overlayTitle">
              GAME OVER
            </h2>

            <p id="overlayText">
              다시 시작 버튼을 눌러주세요.
            </p>
          </div>

        </div>

      </section>


      <!-- ==============================
           오른쪽 : 정보 패널
      =============================== -->
      <aside class="side-panel">

        <!-- 타이머 -->
        <section class="timer-box">
          <span id="timer">
            00:00
          </span>
        </section>


        <!-- NEXT 제목 -->
        <div class="next-title">
          NEXT
        </div>


        <!-- 다음 블록 1 -->
        <section class="next-box main-next">

          <canvas
            id="next1"
            width="100"
            height="80"
          ></canvas>

        </section>


        <!-- 다음 블록 2 -->
        <section class="next-box">

          <canvas
            id="next2"
            width="100"
            height="70"
          ></canvas>

        </section>


        <!-- 다음 블록 3 -->
        <section class="next-box">

          <canvas
            id="next3"
            width="100"
            height="70"
          ></canvas>

        </section>


        <!-- 다음 블록 4 -->
        <section class="next-box">

          <canvas
            id="next4"
            width="100"
            height="70"
          ></canvas>

        </section>


        <!-- 다음 블록 5 -->
        <section class="next-box">

          <canvas
            id="next5"
            width="100"
            height="70"
          ></canvas>

        </section>


        <!-- 점수 -->
        <section class="status-box">

          <span class="status-name">
            SCORE
          </span>

          <strong id="score">
            000000
          </strong>

        </section>


        <!-- 줄 -->
        <section class="status-box">

          <span class="status-name">
            LINES
          </span>

          <strong id="lines">
            000
          </strong>

        </section>


        <!-- 레벨 -->
        <section class="status-box">

          <span class="status-name">
            LEVEL
          </span>

          <strong id="level">
            01
          </strong>

        </section>

      </aside>

    </div>


    <!-- ========================================
         하단 컨트롤
    ========================================= -->
    <div class="control-panel">

      <button
        type="button"
        id="pauseButton"
      >
        PAUSE
      </button>

      <button
        type="button"
        id="restartButton"
      >
        RESTART
      </button>

    </div>


    <!-- ========================================
         조작 안내
    ========================================= -->
    <div class="key-guide">

      <span>
        ← → 이동
      </span>

      <span>
        ↑ 회전
      </span>

      <span>
        ↓ 내리기
      </span>

      <span>
        SPACE 즉시 낙하
      </span>

      <span>
        P 일시정지
      </span>

    </div>

  </main>


  <script src="./js/main.js"></script>

</body>
</html>
